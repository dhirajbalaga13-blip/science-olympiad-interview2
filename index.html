<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Olympiad Tryout Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#16302C;
  --ink-2:#1F3F38;
  --paper:#FAF6EC;
  --paper-2:#F1EAD8;
  --line:#DDD2AF;
  --accent:#D6A419;
  --accent-deep:#A97C0F;
  --good:#3F6E56;
  --good-bg:#E3EEE6;
  --warn:#AE4636;
  --warn-bg:#F6E3DE;
  --text:#20211C;
  --text-muted:#6B6558;
  --radius:7px;
  --mono:'IBM Plex Mono','Courier New',monospace;
  --sans:'IBM Plex Sans',Arial,sans-serif;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:var(--sans);
  background:var(--ink);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button{
  font-family:var(--sans);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

h1,h2,h3,h4{
  margin:0;
  font-family:var(--sans);
}

p{
  margin:0 0 10px 0;
  line-height:1.55;
}

ul{
  margin:0 0 10px 0;
  padding-left:20px;
  line-height:1.55;
}

a{
  color:var(--accent-deep);
}

::selection{
  background:var(--accent);
  color:var(--ink);
}

#app{
  display:flex;
  min-height:100vh;
}

/* ============================================================
   SIDEBAR
============================================================ */

.sidebar{
  width:236px;
  flex-shrink:0;
  background:var(--ink);
  color:var(--paper);
  display:flex;
  flex-direction:column;
  padding:26px 16px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.brand-eyebrow{
  font-family:var(--mono);
  font-size:12px;
  color:var(--accent);
  letter-spacing:.04em;
  margin-bottom:6px;
}

.brand-title{
  font-size:19px;
  font-weight:700;
  line-height:1.3;
  margin-bottom:30px;
}

.nav-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--paper);
  padding:10px 12px;
  border-radius:var(--radius);
  font-size:14.5px;
  cursor:pointer;
  margin-bottom:3px;
}

.nav-btn svg{
  flex-shrink:0;
  width:17px;
  height:17px;
  opacity:.85;
}

.nav-btn:hover{
  background:rgba(255,255,255,.09);
}

.nav-btn.active{
  background:var(--accent);
  color:var(--ink);
}

.sidebar-foot{
  margin-top:auto;
  padding:20px 10px 0;
  font-size:12px;
  line-height:1.55;
  color:rgba(250,246,236,.62);
}

.sidebar-foot strong{
  color:var(--paper);
}

/* ============================================================
   MAIN
============================================================ */

.main{
  flex:1;
  min-width:0;
  background:var(--paper);
  min-height:100vh;
  padding:40px 46px 70px;
}

.view-head{
  margin-bottom:26px;
}

.view-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.08em;
  color:var(--accent-deep);
  margin-bottom:7px;
  font-weight:700;
}

.view-title{
  font-size:31px;
  line-height:1.15;
  letter-spacing:-.025em;
  color:var(--ink);
}

.view-sub{
  margin-top:7px;
  color:var(--text-muted);
  max-width:720px;
  font-size:15px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:14px;
}

.card h3{
  color:var(--ink);
}

.btn-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:var(--radius);
  padding:9px 13px;
  font-size:13.5px;
  font-weight:600;
}

.btn:hover{
  border-color:#B9AA7D;
  background:var(--paper);
}

.btn-primary{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}

.btn-primary:hover{
  background:var(--ink-2);
  border-color:var(--ink-2);
}

.btn-ghost{
  background:transparent;
}

.btn-danger{
  color:#8D3025;
  border-color:#D9A49C;
  background:#FFF8F6;
}

.btn-danger:hover{
  background:var(--warn-bg);
}

.btn-sm{
  padding:7px 10px;
  font-size:12px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  font-size:12px;
  font-family:var(--mono);
  font-weight:600;
  color:var(--text-muted);
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select,
.roster-controls input,
.roster-controls select{
  width:100%;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:#fff;
  color:var(--text);
  padding:10px 11px;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus,
.roster-controls input:focus,
.roster-controls select:focus{
  border-color:var(--accent-deep);
  box-shadow:0 0 0 2px rgba(214,164,25,.14);
}

.field textarea{
  min-height:150px;
  resize:vertical;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:17px;
}

.stat-label{
  font-family:var(--mono);
  color:var(--text-muted);
  font-size:10px;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.stat-value{
  font-size:27px;
  font-weight:700;
  color:var(--ink);
}

.muted{
  color:var(--text-muted);
}

.hint{
  font-size:12px;
  color:var(--text-muted);
  margin-top:10px;
}

.small{
  font-size:12px;
}

.empty-state{
  border:1px dashed var(--line);
  padding:38px 20px;
  text-align:center;
  color:var(--text-muted);
  border-radius:var(--radius);
  background:rgba(255,255,255,.42);
}

.banner{
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:13px 15px;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  font-size:13.5px;
}

.banner-accent{
  background:#F7F0D8;
  border-color:#D9C681;
}

.banner-warn{
  background:var(--warn-bg);
  border-color:#E4B3AA;
  color:#71352E;
}

/* ============================================================
   DASHBOARD
============================================================ */

.dashboard-grid{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:14px;
}

.quick-card{
  min-height:150px;
}

.recent-title{
  font-size:15px;
  margin-bottom:13px;
}

.roster-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.applicant-card{
  border:1px solid var(--line);
  background:#fff;
  border-radius:var(--radius);
  padding:16px;
  cursor:pointer;
  transition:.12s ease;
}

.applicant-card:hover{
  border-color:#BDAA6D;
  transform:translateY(-1px);
}

.applicant-name{
  font-size:16px;
  font-weight:700;
  color:var(--ink);
}

.applicant-meta{
  font-size:12px;
  color:var(--text-muted);
  margin-top:4px;
}

.applicant-card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.applicant-score{
  font-family:var(--mono);
  font-size:12px;
  color:var(--accent-deep);
  white-space:nowrap;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:4px;
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  white-space:nowrap;
}

.badge-New{
  background:#EEE9DA;
  color:#655D4D;
}

.badge-Interviewed{
  background:#E8E5D5;
  color:#665C38;
}

.badge-Callback{
  background:#E6EFE8;
  color:#38604B;
}

.badge-Accepted{
  background:#DDEDE2;
  color:#2E6647;
}

.badge-Waitlisted{
  background:#F4ECD5;
  color:#7A601B;
}

.badge-Not-Selected{
  background:#F3E2DE;
  color:#8A3C32;
}

/* ============================================================
   WIZARD
============================================================ */

.wizard-progress{
  display:flex;
  gap:5px;
  margin-bottom:17px;
}

.wizard-dot{
  height:4px;
  flex:1;
  max-width:85px;
  background:#DDD7C4;
  border-radius:4px;
}

.wizard-dot.current,
.wizard-dot.done{
  background:var(--accent);
}

.step-kicker{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.08em;
  color:var(--accent-deep);
  margin-bottom:7px;
  font-weight:700;
}

.question-purpose{
  background:var(--paper);
  border-left:3px solid var(--accent);
  padding:11px 13px;
  margin:14px 0;
  font-size:13px;
  color:var(--text-muted);
}

.question-list{
  margin-top:18px;
}

.question-list li{
  margin-bottom:8px;
}

.rating-row{
  padding:14px 0;
  border-bottom:1px solid var(--paper-2);
}

.rating-row:last-child{
  border-bottom:none;
}

.rating-name{
  font-size:14px;
  font-weight:700;
  color:var(--ink);
}

.rating-description{
  color:var(--text-muted);
  font-size:12.5px;
  margin:3px 0 8px;
}

.stars{
  display:flex;
  gap:4px;
}

.star{
  width:33px;
  height:30px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:5px;
  color:#B9AE90;
  font-size:15px;
  cursor:pointer;
}

.star:hover,
.star.active{
  background:#F7EBC2;
  color:var(--accent-deep);
  border-color:#D5BD70;
}

.status-select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  padding:9px 10px;
  border-radius:var(--radius);
}

/* ============================================================
   ROSTER
============================================================ */

.roster-controls{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  gap:10px;
  margin-bottom:13px;
}

.chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:16px;
}

.chip{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text-muted);
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  cursor:pointer;
}

.chip:hover{
  background:var(--paper);
}

.chip.active{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}

/* ============================================================
   GUIDE
============================================================ */

.guide-section{
  margin-bottom:28px;
}

.guide-section h3{
  font-size:17px;
  margin-bottom:8px;
}

.guide-section p{
  max-width:820px;
}

.info-box{
  background:#EEF3EC;
  border:1px solid #C6D8C8;
  border-radius:var(--radius);
  padding:13px 15px;
  margin:12px 0;
}

.warning-box{
  background:#FFF7E4;
  border:1px solid #E1C979;
  border-radius:var(--radius);
  padding:14px 15px;
}

.danger-box{
  background:#FFF2EF;
  border:1px solid #E4B1A8;
  border-radius:var(--radius);
  padding:14px 15px;
}

.guide-list{
  max-width:820px;
}

/* ============================================================
   DATA PAGE
============================================================ */

.merge-stat{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:13px;
}

.merge-stat strong{
  display:block;
  color:var(--ink);
  font-size:22px;
  margin-bottom:2px;
}

.merge-stat span{
  display:block;
}

.danger-zone{
  border-color:#D9A49C;
  background:#FFF7F5;
}

/* ============================================================
   MODAL
============================================================ */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(22,48,44,.68);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}

.modal{
  width:min(800px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--paper);
  border-radius:var(--radius);
  border:1px solid #C8B98C;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
  padding:24px;
  position:relative;
}

.modal-close{
  position:absolute;
  right:15px;
  top:12px;
  border:none;
  background:none;
  font-size:25px;
  color:var(--text-muted);
  cursor:pointer;
}

.detail-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  flex-wrap:wrap;
  padding-right:25px;
}

.detail-name{
  font-size:23px;
  font-weight:700;
  color:var(--ink);
}

.detail-meta{
  font-size:13px;
  color:var(--text-muted);
  margin-top:4px;
}

.qa-block{
  margin-bottom:17px;
}

.qa-q{
  font-family:var(--mono);
  font-size:11px;
  color:var(--accent-deep);
  margin-bottom:5px;
  font-weight:600;
}

.qa-a{
  font-size:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:11px 13px;
  white-space:pre-wrap;
  min-height:20px;
}

.qa-a.empty{
  color:#A9A392;
  font-style:italic;
}

/* ============================================================
   TOAST
============================================================ */

.toast{
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--paper);
  padding:13px 24px;
  border-radius:7px;
  font-size:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
  z-index:200;
  opacity:1;
  transition:opacity .25s,transform .25s;
}

.toast.hidden{
  opacity:0;
  transform:translateX(-50%) translateY(10px);
  pointer-events:none;
}

.divider{
  height:1px;
  background:var(--line);
  margin:24px 0;
}

.kv{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  padding:8px 0;
  border-bottom:1px solid var(--paper-2);
}

.kv:last-child{
  border-bottom:none;
}

.kv b{
  font-family:var(--mono);
}

code.filekey{
  font-family:var(--mono);
  background:var(--paper-2);
  padding:2px 6px;
  border-radius:4px;
  font-size:12.5px;
}

/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:950px){
  .sidebar{
    width:210px;
  }

  .main{
    padding:30px 28px 60px;
  }

  .stat-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:720px){
  #app{
    display:block;
  }

  .sidebar{
    width:100%;
    height:auto;
    position:static;
    padding:18px 15px;
  }

  .brand-title{
    margin-bottom:16px;
  }

  .nav-btn{
    display:inline-flex;
    width:auto;
    margin-right:3px;
  }

  #navList{
    display:flex;
    flex-wrap:wrap;
  }

  .sidebar-foot{
    margin-top:14px;
  }

  .main{
    padding:24px 17px 50px;
  }

  .grid-2,
  .grid-3,
  .roster-grid,
  .stat-grid,
  .roster-controls{
    grid-template-columns:1fr;
  }

  .view-title{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div id="app">

  <aside class="sidebar">

    <div class="brand-eyebrow">
      SPECIMEN NO. 5
    </div>

    <div class="brand-title">
      Science Olympiad<br>
      Tryout Tracker
    </div>

    <nav id="navList"></nav>

    <div class="sidebar-foot">
      <strong>Your data lives in this browser.</strong><br>
      Export a backup often from the Backups tab &mdash; see the note there for why that matters.
    </div>

  </aside>

  <main class="main" id="main"></main>

</div>

<div id="modalRoot"></div>

<div id="toast" class="toast hidden"></div>

<!--
  IMPORTANT:
  This is now MULTIPLE files for merge.
  Replace mode still uses the first selected file only.
-->
<input
  type="file"
  id="importFileInput"
  accept="application/json,.json"
  multiple
  style="display:none"
>

<script>
(function(){
"use strict";

/* ============================================================
   CONTENT
============================================================ */

var QUESTIONS = [
  {
    id:"q1",
    short:"Motivation",
    text:"What made you want to join Science Olympiad?",
    purpose:"This tells you whether they're here for a real reason or just filling a slot on a schedule.",
    listenFor:"A specific memory, a person, or an event category that got them curious.",
    green:[
      "Names a specific moment, class, or event that hooked them.",
      "Can already name an event or two they want to try.",
      "Tone picks up when they talk about it."
    ],
    red:[
      "\"It sounded fun\" or \"my friend/parent signed me up\" with nothing added.",
      "Can't name a single event or topic they're curious about.",
      "Answer is one sentence with no follow-up when you ask why."
    ],
    followup:"Try: \"What event are you most excited to try, and why that one?\""
  },
  {
    id:"q2",
    short:"Outside obsession",
    text:"What's something you're genuinely obsessed with outside of school?",
    purpose:"Kids who go deep on something on their own tend to bring that same drive to a build or study event.",
    listenFor:"Depth. Can they teach you something in 30 seconds? Did they go down this path on their own?",
    green:[
      "Gets specific fast.",
      "Mentions doing this unprompted, on their own time.",
      "You learn something new from them."
    ],
    red:[
      "Can't think of anything after a long pause.",
      "Answer stays surface-level even after a follow-up.",
      "Describes something passive with no personal investment."
    ],
    followup:"Try: \"What's the coolest part about that?\""
  },
  {
    id:"q3",
    short:"Problem solving",
    text:"Tell me about a time something you worked on didn't go the way you planned. What did you do?",
    purpose:"This gets at resilience, ownership, and how they react when the obvious plan fails.",
    listenFor:"What they did after the failure, not just how bad the failure was.",
    green:[
      "Owns their part of the problem.",
      "Describes a concrete adjustment.",
      "Can explain what they learned."
    ],
    red:[
      "Blames everyone else.",
      "Can't describe what they changed.",
      "Treats failure as evidence they simply aren't good at something."
    ],
    followup:"Try: \"What would you do differently next time?\""
  },
  {
    id:"q4",
    short:"Creativity",
    text:"If you could add any event to Science Olympiad that doesn't exist, what would it be and why?",
    purpose:"A low-pressure way to see whether they can generate an original idea and explain it.",
    listenFor:"Whether they build an actual event rather than just naming a topic.",
    green:[
      "Invents a concrete challenge.",
      "Explains rules or scoring.",
      "Has a reason it would be fun or educational."
    ],
    red:[
      "Cannot offer an idea at all.",
      "Simply renames an existing event.",
      "Has no explanation for why the event would work."
    ],
    followup:"Try: \"How would teams actually compete in it?\""
  },
  {
    id:"q5",
    short:"Team fit",
    text:"What would make this year's team different from last year in your opinion?",
    purpose:"This looks for constructive thinking about team culture rather than simple criticism.",
    listenFor:"Specific, respectful ideas and whether they're already thinking about contributing.",
    green:[
      "Suggests a concrete improvement.",
      "Balances criticism with respect.",
      "Talks about what they personally could contribute."
    ],
    red:[
      "Purely negative about previous teams.",
      "Has no opinion or idea.",
      "Focuses on popularity or status rather than teamwork."
    ],
    followup:"Try: \"What part of that would you personally help with?\""
  }
];

var RATING_CATEGORIES = [
  {
    id:"passion",
    label:"Interest & Motivation",
    basedOn:"Based on Q1",
    description:"Evidence that they genuinely want to participate.",
    anchors:{
      1:"Little evidence of genuine interest.",
      3:"Interested, but motivation is fairly general.",
      5:"Strong, specific, self-driven motivation."
    }
  },
  {
    id:"communication",
    label:"Communication",
    basedOn:"Across the interview",
    description:"Clarity, specificity, listening, and ability to explain thinking.",
    anchors:{
      1:"Very difficult to follow or gives almost no useful detail.",
      3:"Gets the point across, but needs prompting.",
      5:"Clear, structured, specific, and easy to understand."
    }
  },
  {
    id:"resilience",
    label:"Problem-Solving & Resilience",

var STORAGE_KEY = "sciOlyApplicants_v1";

var DRAFT_KEY = "sciOlyDraft_v1";

var storageOK = true;

function normalizeApplicant(a){
  var base = blankApplicant();

  a = a || {};

  return {
    id:
      (typeof a.id === "string" && a.id)
        ? a.id
        : uid(),

    name:
      typeof a.name === "string"
        ? a.name.trim()
        : "",

    grade:
      typeof a.grade === "string"
        ? a.grade
        : "",

    email:
      typeof a.email === "string"
        ? a.email
        : "",

    notes:
      Object.assign(
        {},
        base.notes,
        (a.notes && typeof a.notes === "object")
          ? a.notes
          : {}
      ),

    ratings:
      Object.assign(
        {},
        base.ratings,
        (a.ratings && typeof a.ratings === "object")
          ? a.ratings
          : {}
      ),

    overallNotes:
      typeof a.overallNotes === "string"
        ? a.overallNotes
        : "",

    status:
      STATUSES.indexOf(a.status) > -1
        ? a.status
        : (
            a.completed
              ? "Interviewed"
              : "New"
          ),

    createdAt:
      typeof a.createdAt === "number"
        ? a.createdAt
        : Date.now(),

    updatedAt:
      typeof a.updatedAt === "number"
        ? a.updatedAt
        : (
            typeof a.createdAt === "number"
              ? a.createdAt
              : Date.now()
          )
  };
}

function loadApplicants(){
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return [];
    }

    var parsed = JSON.parse(raw);

    if(!Array.isArray(parsed)){
      return [];
    }

    return parsed
      .map(normalizeApplicant)
      .filter(function(a){
        return a.name.trim().length > 0;
      });

  }catch(e){
    storageOK = false;
    return [];
  }
}

function saveApplicants(){
  try{
    window.localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(applicants)
    );

    storageOK = true;
    return true;

  }catch(e){

    storageOK = false;

    showToast(
      "Couldn't save — browser storage may be blocked or full. Export a backup now."
    );

    return false;
  }
}

function loadDraft(){

/* ============================================================
   UTILITIES
============================================================ */

function uid(){
  return (
    "a_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,9)
  );
}

function escapeHtml(str){

  if(
    str === undefined ||
    str === null
  ){
    return "";
  }

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function fmtDate(ts){

  if(!ts){
    return "—";
  }

  var d = new Date(ts);

  var months = [
    "Jan","Feb","Mar","Apr","May","Jun",
    "Jul","Aug","Sep","Oct","Nov","Dec"
  ];

  return (
    months[d.getMonth()] +
    " " +
    d.getDate() +
    ", " +
    d.getFullYear()
  );
}

function daysSince(ts){

  if(!ts){
    return null;
  }

  return Math.floor(
    (Date.now() - ts) / 86400000
  );
}

function blankApplicant(){

  return {
    id:null,
    name:"",
    grade:"",
    email:"",
    notes:{
      q1:"",
      q2:"",
      q3:"",
      q4:"",
      q5:""
    },
    ratings:{
      passion:0,
      communication:0,
      resilience:0,
      creativity:0,
      teamfit:0
    },
    overallNotes:"",
    status:"New",
    createdAt:null,
    updatedAt:null
  };
}

function scoreOf(a){

  var vals =
    RATING_CATEGORIES
      .map(function(c){
        return Number(
          a.ratings &&
          a.ratings[c.id]
        ) || 0;
      })
      .filter(function(v){
        return v > 0;
      });

  if(vals.length === 0){
    return null;
  }

  var sum =
    vals.reduce(
      function(s,v){
        return s + v;
      },
      0
    );

  return Math.round(
    (sum / vals.length) * 10
  ) / 10;
}

var toastTimer = null;

function showToast(msg){

  var t =
    document.getElementById("toast");

  t.textContent = msg;

  t.classList.remove("hidden");

  if(toastTimer){
    clearTimeout(toastTimer);
  }

  toastTimer =
    setTimeout(function(){
      t.classList.add("hidden");
    },3200);
}

function startWizard(existing){

  if(existing){

    wizard = {
      editingId:existing.id,
      step:0,
      data:JSON.parse(
        JSON.stringify(existing)
      )
    };

  }else{

    wizard = {
      editingId:null,
      step:0,
      data:blankApplicant()
    };

  }

  saveDraft(wizard);

  pendingResumeDraft = null;

  view = "new-interview";
}

var WIZARD_TOTAL_STEPS =
  2 + QUESTIONS.length;

function renderWizard(){

  if(!wizard){
    startWizard(null);
  }

  var step =
    wizard.step;

  var dots = "";

  for(
    var i=0;
    i<WIZARD_TOTAL_STEPS;
    i++
  ){

    var cls =
      i < step
        ? "done"
        : (
            i === step
              ? "current"
              : ""
          );

    dots +=
      '<div class="wizard-dot ' +
      cls +
      '"></div>';
  }

  var body = "";

  if(step === 0){
    body = wizardStepInfo();
  }

  else if(
    step >= 1 &&
    step <= QUESTIONS.length
  ){
    body =
      wizardStepQuestion(
        QUESTIONS[step - 1]
      );
  }

  else{
    body =
      wizardStepRatings();
  }

  var isFirst =
    step === 0;

  var isLast =
    step ===
    WIZARD_TOTAL_STEPS - 1;

  return (

    '<div class="view-head">' +

      '<div class="view-eyebrow">' +
        (
          wizard.editingId
            ? "EDITING RECORD"
            : "NEW RECORD"
        ) +
      "</div>" +

      '<h1 class="view-title">' +
        (
          wizard.editingId
            ? "Edit interview"
            : "New interview"
        ) +
      "</h1>" +

      '<p class="view-sub">' +
        "Step " +
        (step + 1) +
        " of " +
        WIZARD_TOTAL_STEPS +
        ". Your answers are saved automatically as you go." +
      "</p>" +

    "</div>" +

    '<div class="wizard-progress">' +
      dots +
    "</div>" +

    '<div class="card" style="max-width:720px;">' +
      body +
    "</div>" +

    '<div class="btn-row">' +

      (
        isFirst

          ? '<button type="button" ' +
              'class="btn btn-ghost" ' +
              'data-action="cancel-wizard">' +
              "Cancel" +
            "</button>"

          : '<button type="button" ' +
              'class="btn btn-ghost" ' +
              'data-action="wizard-back">' +
              "Back" +
            "</button>"
      ) +

      (
        isLast

          ? '<button type="button" ' +
              'class="btn btn-primary" ' +
              'data-action="wizard-save">' +
              "Save applicant" +
            "</button>"

          : '<button type="button" ' +
              'class="btn btn-primary" ' +
              'data-action="wizard-next">' +
              "Next" +
            "</button>"
      ) +

    "</div>"
  );
}

function updateRosterResults(){

  var el =
    document.getElementById(
      "rosterResults"
    );

  if(!el){
    return;
  }

  var list =
    applicants.slice();

  if(roster.status !== "All"){

    list =
      list.filter(function(a){
        return a.status === roster.status;
      });
  }

  var q =
    roster.search
      .trim()
      .toLowerCase();

  if(q){

    list =
      list.filter(function(a){

        return (
          (a.name || "")
            .toLowerCase()
            .indexOf(q) > -1 ||

          (a.grade || "")
            .toLowerCase()
            .indexOf(q) > -1
        );

      });
  }

  list.sort(function(a,b){

    if(roster.sort === "date-desc"){
      return (
        (b.createdAt || 0) -
        (a.createdAt || 0)
      );
    }

    if(roster.sort === "date-asc"){
      return (
        (a.createdAt || 0) -
        (b.createdAt || 0)
      );
    }

    if(roster.sort === "name-asc"){
      return (
        (a.name || "")
          .localeCompare(
            b.name || ""
          )
      );
    }

    var sa = scoreOf(a);
    var sb = scoreOf(b);

    sa = sa === null ? -1 : sa;
    sb = sb === null ? -1 : sb;

    if(roster.sort === "score-desc"){
      return sb - sa;
    }

    if(roster.sort === "score-asc"){
      return sa - sb;
    }

    return 0;
  });

  if(applicants.length === 0){

    el.innerHTML =
      '<div class="empty-state">' +
        "<h3>No applicants yet</h3>" +
        "<p>Run your first interview to start building the roster.</p>" +
      "</div>";

    return;
  }

  if(list.length === 0){

    el.innerHTML =
      '<div class="empty-state">' +
        "<h3>No matches</h3>" +
        "<p>Try a different search term or status filter.</p>" +
      "</div>";

    return;
  }

  el.innerHTML =
    '<div class="roster-grid">' +
      list
        .map(applicantCardHtml)
        .join("") +
    "</div>";
}

function downloadBlob(
  content,
  filename,
  type
){

  var blob =
    new Blob(
      [content],
      {type:type}
    );

  var url =
    URL.createObjectURL(blob);

  var a =
    document.createElement("a");

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  setTimeout(function(){
    URL.revokeObjectURL(url);
  },1000);
}

function todayStr(){

  var d =
    new Date();

  function pad(n){
    return n < 10
      ? "0" + n
      : "" + n;
  }

  return (
    d.getFullYear() +
    "-" +
    pad(d.getMonth() + 1) +
    "-" +
    pad(d.getDate())
  );
}

function exportJson(){

  );

  meta.lastBackupAt =

}

function csvEscape(v){

  var s =
    (
      v === undefined ||
      v === null
    )
      ? ""
      : String(v);

  if(/[",\n]/.test(s)){
    s =
      '"' +
      s.replace(/"/g,'""') +
      '"';
  }

  return s;
}

      a.name,
      a.grade,
      a.email,
      a.status,
      (
        scoreOf(a) !== null
          ? scoreOf(a).toFixed(1)
          : ""
      )
    ];

    QUESTIONS.forEach(function(q){
      row.push(
        a.notes[q.id] || ""
      );
    });

    RATING_CATEGORIES.forEach(function(c){
      row.push(
        a.ratings[c.id] || ""
      );
    });

    row.push(
      a.overallNotes || "",
      fmtDate(a.createdAt)
    );

    rows.push(row);
  });

  var csv =
    rows
      .map(function(r){
        return r
          .map(csvEscape)
          .join(",");
      })
      .join("\r\n");

  downloadBlob(
    csv,
    "science-olympiad-applicants-" +
      todayStr() +
      ".csv",
    "text/csv"
  );

  meta.lastBackupAt =
    Date.now();

  saveMeta(meta);

  showToast(
    "Spreadsheet downloaded."
  );

  render();
}

/* ============================================================
   IMPORT NORMALIZATION
============================================================ */

function normalizeImportedData(data){

  if(!data){
    throw new Error(
      "The file is empty."
    );
  }

  var records = null;

  /*
    Accept both:
      { applicants:[...] }
    and:
      [...]
  */

  if(Array.isArray(data)){

    records = data;

  }

  else if(
    Array.isArray(
      data.applicants
    )
  ){

    records =
      data.applicants;

  }

  else{

    throw new Error(
      "This does not appear to be a Science Olympiad Interview HQ backup."
    );

  }

  return records
    .filter(function(record){
      return (
        record &&
        typeof record === "object"
      );
    })
    .map(normalizeApplicant)
    .filter(function(applicant){
      return applicant.name.trim();
    });
}

/* ============================================================
   MULTI-FILE MERGE
============================================================ */

async function mergeSelectedFiles(){

  var input =
    document.getElementById(
      "importFileInput"
    );

  var files =
    Array.from(
      input.files || []
    );

  if(!files.length){

    alert(
      "Please select at least one JSON backup file."
    );

    return;
  }

  var confirmed =
    window.confirm(

      "You selected " +
      files.length +
      " backup file(s).\n\n" +

      "The applicants in those files will be added to your current master list.\n\n" +

      "Existing records with the exact same applicant ID will use the newer version.\n\n" +

      "Applicants with different IDs but the same name will NOT be automatically merged.\n\n" +

      "Continue?"

    );

  if(!confirmed){
    return;
  }

  var totalRecords = 0;
  var added = 0;
  var updated = 0;
  var skipped = 0;

  var errors = [];

  var importedRecords = [];

  /*
    Read every selected file.
  */

  for(
    var i=0;
    i<files.length;
    i++
  ){

    var file =
      files[i];

    try{

      var text =
        await file.text();

      var data =
        JSON.parse(text);

      var records =
        normalizeImportedData(data);

      totalRecords +=
        records.length;

      importedRecords.push(
        ...records
      );

    }catch(error){

      errors.push(
        file.name +
        ": " +
        (
          error &&
          error.message
            ? error.message
            : "invalid JSON"
        )
      );
    }
  }

  /*
    Exact-ID merge.
    Same ID = same applicant record.
    Newer updatedAt wins.
  */

  var byId =
    new Map(
      applicants.map(function(applicant){
        return [
          applicant.id,
          applicant
        ];
      })
    );

  importedRecords.forEach(function(imported){

    var existing =
      byId.get(
        imported.id
      );

    if(!existing){

      applicants.push(
        imported
      );

      byId.set(
        imported.id,
        imported
      );

      added++;

      return;
    }

    var existingTime =
      Number(
        existing.updatedAt
      ) || 0;

    var importedTime =
      Number(
        imported.updatedAt
      ) || 0;

    if(importedTime > existingTime){

      var index =
        applicants.findIndex(
          function(applicant){
            return (
              applicant.id ===
              imported.id
            );
          }
        );

      if(index >= 0){

        applicants[index] =
          imported;
      }

      byId.set(
        imported.id,
        imported
      );

      updated++;

    }else{

      skipped++;
    }

  });

  var saved =
    saveApplicants();

  if(!saved){

    alert(
      "The files were read, but the browser could not save the merged roster."
    );

    return;
  }

  /*
    Find same-name records with different IDs.
    These are deliberately NOT merged.
  */

  var possibleDuplicates =
    findPossibleDuplicateNames();

  /*
    Refresh everything.
  */

  render();

  /*
    Put summary into the newly rendered data page.
  */

  var summary =
    document.getElementById(
      "mergeSummary"
    );

  if(summary){

    summary.innerHTML =

      '<div class="info-box" style="margin-top:15px;">' +

        "<h3 style=\"font-size:15px;margin-bottom:12px;\">" +
          "Merge complete" +
        "</h3>" +

        '<div class="grid-3">' +

          mergeStat(
            files.length,
            "Files processed"
          ) +

          mergeStat(
            totalRecords,
            "Records found"
          ) +

          mergeStat(
            added,
            "New applicants added"
          ) +

          mergeStat(
            updated,
            "Existing records updated"
          ) +

          mergeStat(
            skipped,
            "Older duplicates skipped"
          ) +

          mergeStat(
            possibleDuplicates.length,
            "Possible duplicate names"
          ) +

        "</div>" +

      "</div>" +

      (
        errors.length

          ? (
              '<div class="danger-box" style="margin-top:15px;">' +

                "<strong>Files with errors:</strong>" +

                "<ul>" +

                  errors
                    .map(function(error){
                      return (
                        "<li>" +
                        escapeHtml(error) +
                        "</li>"
                      );
                    })
                    .join("") +

                "</ul>" +

              "</div>"
            )

          : ""
      ) +

      (
        possibleDuplicates.length

          ? (
              '<div class="warning-box" style="margin-top:15px;">' +

                "<strong>Possible duplicate applicants detected.</strong>" +

                "<p style=\"margin-top:7px;\">" +
                  "Applicants with the same normalized name but different IDs were kept as separate records. This is intentional so two different students with the same name are not accidentally merged." +
                "</p>" +

                "<ul>" +

                  possibleDuplicates
                    .map(function(group){

                      return (
                        "<li>" +
                          group
                            .map(function(name){
                              return escapeHtml(name);
                            })
                            .join(" · ") +
                        "</li>"
                      );

                    })
                    .join("") +

                "</ul>" +

              "</div>"
            )

          : (
              '<div class="info-box" style="margin-top:15px;">' +
                "No possible duplicate names were detected." +
              "</div>"
            )
      );

  }

  showToast(
    "Merged " +
    added +
    " new applicant(s) and updated " +
    updated +
    " existing record(s)."
  );

  input.value = "";
}

function mergeStat(number,label){

  return (
    '<div class="merge-stat">' +

      "<strong>" +
        number +
      "</strong>" +

      '<span class="small muted">' +
        escapeHtml(label) +
      "</span>" +

    "</div>"
  );
}

/* ============================================================
   POSSIBLE DUPLICATES
============================================================ */

function normalizeName(name){

  return String(name || "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"")
    .trim();
}

function findPossibleDuplicateNames(){

  var groups =
    new Map();

  applicants.forEach(function(applicant){

    var normalized =
      normalizeName(
        applicant.name
      );

    if(!normalized){
      return;
    }

    if(!groups.has(normalized)){

      groups.set(
        normalized,
        []
      );
    }

    groups
      .get(normalized)
      .push(applicant);

  });

  return Array.from(
    groups.values()
  )
  .filter(function(group){
    /*
      More than one applicant with the
      same normalized name.
    */
    return group.length > 1;
  })
  .map(function(group){

    return group.map(
      function(applicant){
        return applicant.name;
      }
    );

  });
}

/* ============================================================
   REPLACE EVERYTHING
============================================================ */

async function replaceWithSelectedFile(){

  var input =
    document.getElementById(
      "importFileInput"
    );

  var file =
    input.files &&
    input.files[0];

  if(!file){

    alert(
      "Please select a JSON backup file."
    );

    return;
  }

  try{

    var text =
      await file.text();

    var data =
      JSON.parse(text);

    var cleaned =
      normalizeImportedData(
        data
      );

    if(!cleaned.length){

      throw new Error(
        "The backup contains no valid applicants."
      );
    }

    var confirmed =
      window.confirm(

        "This will replace all " +
        applicants.length +
        " current applicant(s) with " +
        cleaned.length +
        " applicant(s) from the selected backup.\n\n" +

        "This cannot be undone unless you have another backup.\n\n" +

        "Continue?"

      );

    if(!confirmed){
      return;
    }

    applicants =
      cleaned;

    if(!saveApplicants()){

      throw new Error(
        "Could not save the restored roster."
      );
    }

    clearDraft();

    pendingResumeDraft =
      null;

    showToast(
      "Backup restored."
    );

    view =
      "roster";

    render();

  }catch(error){

    alert(
      "That file is not a valid Science Olympiad Interview HQ backup.\n\n" +
      (
        error &&
        error.message
          ? error.message
          : ""
      )
    );

  }finally{

    input.value = "";
  }
}

/* ============================================================
   ERASE
============================================================ */

function eraseAll(){

  if(!applicants.length){

    alert(
      "There are no applicant records to erase."
    );

    return;
  }

  if(
    !window.confirm(
      "ERASE ALL APPLICANT RECORDS from this browser?\n\nThis cannot be undone without a backup."
    )
  ){

    return;
  }

  if(
    !window.confirm(
      "Final confirmation: have you exported a backup?\n\nClick OK only if you are certain."
    )
  ){

    return;
  }

  applicants = [];

  var success =
    saveApplicants();

  if(success){

    showToast(
      "All browser records erased."
    );

    view =
      "dashboard";

    render();

  }else{

    alert(
      "The browser did not allow the records to be erased."
    );
  }
}

/* ============================================================
   ACTIONS
============================================================ */

function goTo(v){

  view = v;

  render();
}

function beginNewInterviewFlow(){

  if(pendingResumeDraft){

    var draftName =
      pendingResumeDraft.data.name ||
      "someone";

    if(
      !window.confirm(
        "You have an unfinished interview for " +
        draftName +
        ". Starting a new one will discard it. Continue?"
      )
    ){

      return;
    }

    clearDraft();

    pendingResumeDraft =
      null;
  }

  startWizard(null);

  render();
}

function handleWizardBind(el){

  var field =
    el.getAttribute(
      "data-bind"
    );

  var noteField =
    el.getAttribute(
      "data-bind-note"
    );

  var isOverall =
    el.hasAttribute(
      "data-bind-overall"
    );

  if(field){

    wizard.data[field] =
      el.value;
  }

  else if(noteField){

    wizard.data.notes[noteField] =
      el.value;
  }

  else if(isOverall){

    wizard.data.overallNotes =
      el.value;
  }

  saveDraft(wizard);
}

function finishSaveApplicant(){

  var d =
    wizard.data;

  if(
    !d.name ||
    !d.name.trim()
  ){

    showToast(
      "Add a name before saving."
    );

    wizard.step =
      0;

    render();

    return;
  }

  var now =
    Date.now();

  d.name =
    d.name.trim();

  d.updatedAt =
    now;

  if(!wizard.editingId){

    d.id =
      d.id || uid();

    d.createdAt =
      d.createdAt || now;

    applicants.push(d);

    showToast(
      "Added " +
      d.name +
      " to the roster."
    );

  }else{

    var index =
      applicants.findIndex(
        function(a){
          return (
            a.id ===
            wizard.editingId
          );
        }
      );

    if(index > -1){

      applicants[index] =
        d;

      showToast(
        "Saved changes for " +
        d.name +
        "."
      );

    }else{

      applicants.push(d);

      showToast(
        "Added " +
        d.name +
        " to the roster."
      );
    }
  }

  saveApplicants();

  clearDraft();

  pendingResumeDraft =
    null;

  wizard = null;

  goTo("roster");
}

/* ============================================================
   GLOBAL EVENT LISTENERS
============================================================ */

function attachGlobalListeners(){

  document.body.addEventListener(
    "click",
    function(e){

      var backdrop =
        e.target.closest(
          ".modal-backdrop"
        );

      var stopEl =
        e.target.closest(
          "[data-stop]"
        );

      if(
        backdrop &&
        !stopEl
      ){

        detailId = null;

        renderModal();

        return;
      }

      var target =
        e.target.closest(
          "[data-action]"
        );

      if(!target){
        return;
      }

      var action =
        target.getAttribute(
          "data-action"
        );

      /* NAV */

      if(action === "nav"){

        var targetView =
          target.getAttribute(
            "data-view"
          );

        if(
          targetView ===
            "new-interview" &&
          !wizard
        ){

          beginNewInterviewFlow();

        }else{

          goTo(
            targetView
          );
        }

        return;
      }

      /* START */

      if(
        action ===
        "start-interview"
      ){

        beginNewInterviewFlow();

        return;
      }

      /* RESUME */

      if(
        action ===
        "resume-draft"
      ){

        wizard =
          pendingResumeDraft;

        pendingResumeDraft =
          null;

        view =
          "new-interview";

        render();

        return;
      }

      /* DISCARD */

      if(
        action ===
        "discard-draft"
      ){

        clearDraft();

        pendingResumeDraft =
          null;

        render();

        return;
      }

      /* CANCEL */

      if(
        action ===
        "cancel-wizard"
      ){

        clearDraft();

        wizard = null;

        goTo(
          "dashboard"
        );

        return;
      }

      /* BACK */

      if(
        action ===
        "wizard-back"
      ){

        wizard.step =
          Math.max(
            0,
            wizard.step - 1
          );

        saveDraft(wizard);

        render();

        return;
      }

      /* NEXT */

      if(
        action ===
        "wizard-next"
      ){

        if(
          wizard.step === 0 &&
          !wizard.data.name.trim()
        ){

          showToast(
            "Add a name before continuing."
          );

          return;
        }

        wizard.step =
          Math.min(
            WIZARD_TOTAL_STEPS - 1,
            wizard.step + 1
          );

        saveDraft(wizard);

        render();

        return;
      }

      /* SAVE */

      if(
        action ===
        "wizard-save"
      ){

        finishSaveApplicant();

        return;
      }

      /* RATING */

      if(
        action ===
        "set-rating"
      ){

        var category =
          target.getAttribute(
            "data-cat"
          );

        var value =
          parseInt(
            target.getAttribute(
              "data-val"
            ),
            10
          );

        if(
          wizard.data.ratings[
            category
          ] === value
        ){

          wizard.data.ratings[
            category
          ] = 0;

        }else{

          wizard.data.ratings[
            category
          ] = value;
        }

        saveDraft(wizard);

        render();

        return;
      }

      /* OPEN DETAIL */

      if(
        action ===
        "open-detail"
      ){

        detailId =
          target.getAttribute(
            "data-id"
          );

        renderModal();

        return;
      }

      /* CLOSE MODAL */

      if(
        action ===
        "close-modal"
      ){

        detailId = null;

        renderModal();

        return;
      }

      /* EDIT */

      if(
        action ===
        "edit-applicant"
      ){

        var editId =
          target.getAttribute(
            "data-id"
          );

        var found =
          applicants.find(
            function(a){
              return a.id === editId;
            }
          );

        if(found){

          detailId = null;

          renderModal();

          startWizard(found);

          render();

        }

        return;
      }

      /* DELETE */

      if(
        action ===
        "delete-applicant"
      ){

        var deleteId =
          target.getAttribute(
            "data-id"
          );

        var foundDelete =
          applicants.find(
            function(a){
              return a.id === deleteId;
            }
          );

        var name =
          foundDelete
            ? foundDelete.name
            : "this applicant";

        if(
          window.confirm(
            "Delete " +
            name +
            "? This cannot be undone. Consider exporting a backup first."
          )
        ){

          applicants =
            applicants.filter(
              function(a){
                return a.id !== deleteId;
              }
            );

          saveApplicants();

          detailId = null;

          renderModal();

          render();

          showToast(
            name +
            " was deleted."
          );
        }

        return;
      }

      /* FILTER */

      if(
        action ===
        "filter-status"
      ){

        roster.status =
          target.getAttribute(
            "data-status"
          );

        render();

        return;
      }

      /* EXPORT JSON */

      if(
        action ===
        "export-json"
      ){

        exportJson();

        return;
      }

      /* EXPORT CSV */

      if(
        action ===
        "export-csv"
      ){

        exportCsv();

        return;
      }

      /* MULTI-FILE MERGE */

      if(
        action ===
        "import-merge"
      ){

        var mergeInput =
          document.getElementById(
            "importFileInput"
          );

        mergeInput.multiple =
          true;

        mergeInput.setAttribute(
          "data-mode",
          "merge"
        );

        mergeInput.value = "";

        mergeInput.click();

        return;
      }

      /* REPLACE */

      if(
        action ===
        "import-replace"
      ){

        var replaceInput =
          document.getElementById(
            "importFileInput"
          );

        replaceInput.multiple =
          false;

        replaceInput.setAttribute(
          "data-mode",
          "replace"
        );

        replaceInput.value = "";

        replaceInput.click();

        return;
      }

      /* ERASE */

      if(
        action ===
        "erase-all"
      ){

        eraseAll();

        return;
      }

    }
  );

  /* INPUT */

  document.body.addEventListener(
    "input",
    function(e){

      var el =
        e.target;

      if(
        el.matches(
          "[data-bind], [data-bind-note], [data-bind-overall]"
        )
      ){

        handleWizardBind(el);

      }

      else if(
        el.id ===
        "rosterSearch"
      ){

        roster.search =
          el.value;

        updateRosterResults();
      }
    }
  );

  /* CHANGE */

  document.body.addEventListener(
    "change",
    function(e){

      var el =
        e.target;

      if(
        el.matches(
          "[data-bind]"
        )
      ){

        handleWizardBind(el);

      }

      else if(
        el.id ===
        "rosterSort"
      ){

        roster.sort =
          el.value;

        updateRosterResults();
      }

    }
  );

  /* FILE INPUT */

  document
    .getElementById(
      "importFileInput"
    )
    .addEventListener(
      "change",
      async function(e){

        var input =
          e.target;

        var mode =
          input.getAttribute(
            "data-mode"
          );

        if(mode === "replace"){

          await replaceWithSelectedFile();

        }else{

          await mergeSelectedFiles();

        }

      }
    );
}

/* ============================================================
   START
============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    render();

    attachGlobalListeners();

  }
);

})();
</script>
