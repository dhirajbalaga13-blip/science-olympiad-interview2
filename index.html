<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Science Olympiad applicant interview tracker">
<title>Science Olympiad Interview HQ</title>

<style>
:root{
  --nav:#10233f;
  --nav2:#18365d;
  --blue:#1769e0;
  --blue2:#0f4fae;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#17212f;
  --muted:#68778a;
  --line:#dbe3ed;
  --good:#087443;
  --warn:#9a5b00;
  --bad:#b42318;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  outline:3px solid #9ec5ff;
  outline-offset:1px
}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:255px 1fr
}

aside{
  background:var(--nav);
  color:#fff;
  padding:22px 16px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto
}

.brand{
  font-size:21px;
  font-weight:850;
  letter-spacing:-.3px
}

.tag{
  font-size:12px;
  color:#b7c7dc;
  margin:2px 0 24px
}

nav button{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#dce7f6;
  padding:11px 12px;
  border-radius:9px;
  margin:4px 0
}

nav button:hover,
nav button.active{
  background:var(--nav2);
  color:#fff
}

.side-note{
  margin-top:28px;
  border-top:1px solid #36506f;
  padding-top:18px;
  font-size:12px;
  color:#b7c7dc
}

.side-note strong{color:#fff}

main{
  width:100%;
  max-width:1220px;
  margin:auto;
  padding:28px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  margin-bottom:20px
}

h1{
  font-size:30px;
  line-height:1.2;
  margin:0 0 5px;
  letter-spacing:-.5px
}

h2{
  font-size:20px;
  margin:0 0 12px
}

h3{
  font-size:16px;
  margin:0 0 8px
}

.muted{color:var(--muted)}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  padding:9px 13px;
  border-radius:8px;
  font-weight:700
}

.btn:hover{
  border-color:#aebdce;
  background:#f9fbfd
}

.btn.primary{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff
}

.btn.primary:hover{background:var(--blue2)}
.btn.good{color:var(--good)}
.btn.danger{color:var(--bad)}

.btn.small{
  padding:6px 9px;
  font-size:13px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 10px rgba(23,43,77,.045)
}

.stat{
  font-size:31px;
  font-weight:850
}

.pill{
  display:inline-block;
  border-radius:999px;
  background:#eaf2ff;
  color:#1558ad;
  padding:3px 9px;
  font-size:12px;
  font-weight:800
}

.pill.good{
  background:#e9f8ef;
  color:#087443
}

.pill.warn{
  background:#fff5df;
  color:#8a5200
}

label{
  display:block;
  font-weight:750;
  margin:14px 0 6px
}

input,
textarea,
select{
  width:100%;
  border:1px solid #c9d4e1;
  border-radius:8px;
  padding:10px 11px;
  background:#fff;
  color:var(--text)
}

textarea{
  min-height:105px;
  resize:vertical
}

hr{
  border:0;
  border-top:1px solid var(--line);
  margin:20px 0
}

.notice{
  border:1px solid #efd18b;
  background:#fff8e8;
  border-radius:10px;
  padding:13px 15px;
  margin:12px 0
}

.notice.good{
  border-color:#a9dfbf;
  background:#edfbf3
}

.question{
  border:1px solid var(--line);
  border-radius:10px;
  padding:15px;
  margin:13px 0;
  background:#fbfcfe
}

.qhead{
  display:flex;
  gap:10px;
  align-items:flex-start
}

.qtext{
  font-weight:800;
  margin-top:6px
}

.score-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--line)
}

.score-row:last-child{border-bottom:0}

.stars{white-space:nowrap}

.stars button{
  border:0;
  background:none;
  color:#c7ced8;
  font-size:24px;
  line-height:1;
  padding:0 1px
}

.stars button.on{color:#e99a00}

.applicant{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--line)
}

.applicant:last-child{border-bottom:0}

.empty{
  text-align:center;
  padding:42px 15px;
  color:var(--muted)
}

.stepper{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:17px
}

.stepper span{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:700
}

.stepper b{
  width:27px;
  height:27px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#dfe7f1;
  color:#526173
}

.stepper .active b{
  background:var(--blue);
  color:#fff
}

details{
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 13px;
  margin:9px 0;
  background:#fff
}

summary{
  font-weight:750;
  cursor:pointer
}

ul,ol{padding-left:23px}

.danger-zone{
  border:1px solid #efb0aa;
  background:#fff7f6
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#10233f;
  color:#fff;
  padding:12px 15px;
  border-radius:9px;
  box-shadow:0 7px 25px rgba(0,0,0,.18);
  z-index:20;
  max-width:360px
}

@media(max-width:850px){
  .app{grid-template-columns:1fr}
  aside{
    position:static;
    height:auto
  }
  .grid3,.grid2{grid-template-columns:1fr}
  main{padding:18px}
  .top{flex-direction:column}
}

@media(max-width:560px){
  .applicant,.score-row{
    align-items:flex-start;
    flex-direction:column;
    display:flex
  }

  .stars{width:100%}
}
</style>
</head>

<body>

<div class="app">

<aside>

<div class="brand">Science Olympiad</div>
<div class="tag">Interview HQ &bull; GitHub Pages edition</div>

<nav>

<button data-page="dashboard" class="active">
&#127968; Dashboard
</button>

<button data-page="interview">
&#10133; New Interview
</button>

<button data-page="applicants">
&#128101; Applicants
</button>

<button data-page="guide">
&#128214; Idiot's Guide
</button>

<button data-page="data">
&#128190; Backup &amp; Data
</button>

</nav>

<div class="side-note">

<strong>DATA SAFETY</strong>

<br><br>

Records are saved in this browser.
They are not stored in this GitHub repository.
Export a JSON backup regularly.

</div>

</aside>

<main id="main"></main>

</div>

<script>

"use strict";

/*
SCIENCE OLYMPIAD INTERVIEW HQ

Static GitHub Pages application.

Applicant information is NOT stored in GitHub.

Data is stored locally in the browser using IndexedDB.
localStorage is used as a fallback if IndexedDB is unavailable.

IMPORTANT:
Never upload applicant JSON backups to GitHub.
*/

const DB_NAME = "ScienceOlympiadInterviewHQ";
const DB_VERSION = 1;
const STORE = "applicants";
const FALLBACK_KEY = "sciOlyInterviewHQ_fallback_v2";

const QUESTIONS = [

"What made you want to join Science Olympiad?",

"What's something you're genuinely obsessed with outside of school?",

"Tell me about a time something you worked on didn't go the way you planned. What did you do?",

"If you could add any event to Science Olympiad that doesn't exist, what would it be and why?",

"What would make this year's team different from last year in your opinion?"

];

const RATINGS = [

[
"Interest & motivation",
"Evidence that they genuinely want to participate and understand what they are joining."
],

[
"Curiosity & passion",
"Depth, enthusiasm, curiosity, or genuine interest in something."
],

[
"Problem solving",
"How thoughtfully they respond to setbacks, obstacles, and mistakes."
],

[
"Creativity",
"Original ideas, flexible thinking, and interesting perspectives."
],

[
"Team fit",
"Likelihood of contributing positively and working well with teammates."
],

[
"Communication",
"Clarity, specificity, listening, and ability to explain their thinking."
]

];

let db = {
  applicants:[]
};

let storageMode = "IndexedDB";
let page = "dashboard";
let current = null;


/* =========================
   UTILITY FUNCTIONS
========================= */

function uid(){

  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }

  return "a-" +
    Date.now() +
    "-" +
    Math.random().toString(16).slice(2);

}


function esc(v){

  return String(v ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


function clone(v){

  return JSON.parse(JSON.stringify(v));

}


function ratingAverage(a){

  const values =
    Object.values(a.ratings || {})
      .map(Number)
      .filter(n => n >= 1 && n <= 5);

  if(!values.length){
    return 0;
  }

  return Math.round(
    values.reduce((x,y)=>x+y,0) /
    values.length *
    10
  ) / 10;

}


function ratingsCount(a){

  return Object
    .values(a.ratings || {})
    .filter(n => Number(n) >= 1 && Number(n) <= 5)
    .length;

}


function status(a){

  return a.completed
    ? "Complete"
    : "In progress";

}


function dateText(ts){

  if(!ts){
    return "\u2014";
  }

  try{

    return new Date(ts).toLocaleString(
      [],
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );

  }catch{

    return "\u2014";

  }

}


function toast(message){

  const old =
    document.querySelector(".toast");

  if(old){
    old.remove();
  }

  const t =
    document.createElement("div");

  t.className = "toast";
  t.textContent = message;

  document.body.appendChild(t);

  setTimeout(
    ()=>t.remove(),
    2600
  );

}


/* =========================
   INDEXED DB
========================= */

function openIDB(){

  return new Promise((resolve,reject)=>{

    if(!("indexedDB" in window)){
      reject(
        new Error("IndexedDB unavailable")
      );
      return;
    }

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded = ()=>{

      if(
        !request.result.objectStoreNames
          .contains(STORE)
      ){

        request.result.createObjectStore(
          STORE,
          {keyPath:"id"}
        );

      }

    };

    request.onsuccess =
      ()=>resolve(request.result);

    request.onerror =
      ()=>reject(
        request.error ||
        new Error("Could not open database")
      );

  });

}


async function idbAll(){

  const database =
    await openIDB();

  return new Promise(
    (resolve,reject)=>{

      const request =
        database
          .transaction(STORE,"readonly")
          .objectStore(STORE)
          .getAll();

      request.onsuccess = ()=>{

        database.close();

        resolve(
          request.result || []
        );

      };

      request.onerror = ()=>{

        database.close();

        reject(request.error);

      };

    }
  );

}


async function idbPut(applicant){

  const database =
    await openIDB();

  return new Promise(
    (resolve,reject)=>{

      const request =
        database
          .transaction(STORE,"readwrite")
          .objectStore(STORE)
          .put(applicant);

      request.onsuccess = ()=>{

        database.close();

        resolve();

      };

      request.onerror = ()=>{

        database.close();

        reject(request.error);

      };

    }
  );

}


async function idbDelete(id){

  const database =
    await openIDB();

  return new Promise(
    (resolve,reject)=>{

      const request =
        database
          .transaction(STORE,"readwrite")
          .objectStore(STORE)
          .delete(id);

      request.onsuccess = ()=>{

        database.close();

        resolve();

      };

      request.onerror = ()=>{

        database.close();

        reject(request.error);

      };

    }
  );

}


async function idbClear(){

  const database =
    await openIDB();

  return new Promise(
    (resolve,reject)=>{

      const request =
        database
          .transaction(STORE,"readwrite")
          .objectStore(STORE)
          .clear();

      request.onsuccess = ()=>{

        database.close();

        resolve();

      };

      request.onerror = ()=>{

        database.close();

        reject(request.error);

      };

    }
  );

}


/* =========================
   FALLBACK STORAGE
========================= */

function fallbackRead(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          FALLBACK_KEY
        ) || "{}"
      );

    return Array.isArray(data.applicants)
      ? data.applicants
      : [];

  }catch{

    return [];

  }

}


function fallbackWrite(){

  localStorage.setItem(
    FALLBACK_KEY,
    JSON.stringify({
      version:2,
      applicants:db.applicants
    })
  );

}


/* =========================
   LOAD / SAVE
========================= */

async function loadData(){

  try{

    const list =
      await idbAll();

    storageMode =
      "IndexedDB";

    db.applicants =
      list.sort(
        (a,b)=>
          (a.updatedAt || 0) -
          (b.updatedAt || 0)
      );

  }catch{

    storageMode =
      "localStorage fallback";

    db.applicants =
      fallbackRead();

  }

}


async function persist(applicant){

  applicant.updatedAt =
    Date.now();

  if(storageMode === "IndexedDB"){

    try{

      await idbPut(applicant);

      return true;

    }catch{

      storageMode =
        "localStorage fallback";

    }

  }

  try{

    fallbackWrite();

    return true;

  }catch{

    return false;

  }

}


async function removeApplicant(id){

  if(storageMode === "IndexedDB"){

    try{

      await idbDelete(id);

      db.applicants =
        db.applicants.filter(
          a => a.id !== id
        );

      return true;

    }catch{

      storageMode =
        "localStorage fallback";

    }

  }

  db.applicants =
    db.applicants.filter(
      a => a.id !== id
    );

  try{

    fallbackWrite();

    return true;

  }catch{

    return false;

  }

}


async function replaceAll(list){

  if(storageMode === "IndexedDB"){

    try{

      await idbClear();

      for(const applicant of list){

        await idbPut(applicant);

      }

      db.applicants =
        list;

      return true;

    }catch{

      storageMode =
        "localStorage fallback";

    }

  }

  db.applicants =
    list;

  try{

    fallbackWrite();

    return true;

  }catch{

    return false;

  }

}


/* =========================
   NAVIGATION
========================= */

function go(p){

  page = p;
  current = null;

  document
    .querySelectorAll("nav button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === p
      );

    });

  render();

}


document
  .querySelectorAll("nav button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => go(button.dataset.page)
    );

  });


function header(
  title,
  subtitle,
  buttons=""
){

  return `
    <div class="top">

      <div>

        <h1>${title}</h1>

        <div class="muted">
          ${subtitle}
        </div>

      </div>

      <div class="actions">
        ${buttons}
      </div>

    </div>
  `;

}


/* =========================
   DASHBOARD
========================= */

function dashboard(main){

  const total =
    db.applicants.length;

  const complete =
    db.applicants
      .filter(a=>a.completed)
      .length;

  const averages =
    db.applicants
      .map(ratingAverage)
      .filter(Boolean);

  const overall =
    averages.length
      ? Math.round(
          averages.reduce(
            (a,b)=>a+b,
            0
          ) /
          averages.length *
          10
        ) / 10
      : 0;

  const lastBackup =
    localStorage.getItem(
      "sciOlyLastBackupAt"
    );

  main.innerHTML =

    header(
      "Interview HQ",
      "Your Science Olympiad tryout command center.",
      `
        <button
          class="btn primary"
          onclick="startNew()"
        >
          + New applicant
        </button>
      `
    )

    +

    `
    <div class="grid3">

      <div class="card">

        <div class="muted">
          Applicants
        </div>

        <div class="stat">
          ${total}
        </div>

      </div>


      <div class="card">

        <div class="muted">
          Completed
        </div>

        <div class="stat">
          ${complete}
        </div>

      </div>


      <div class="card">

        <div class="muted">
          Average rating
        </div>

        <div class="stat">
          ${overall || "\u2014"}
        </div>

      </div>

    </div>


    <div class="notice ${lastBackup ? "good" : ""}">

      <b>
        ${lastBackup
          ? "Backup status:"
          : "First priority:"}
      </b>

      ${
        lastBackup
        ?
        `Last JSON backup recorded
         ${esc(dateText(Number(lastBackup)))}.`
        :
        `Make a JSON backup after your
         first few interviews and at the
         end of every session.`
      }

      <button
        class="btn small"
        onclick="go('data')"
        style="margin-left:8px"
      >
        Backup & Data
      </button>

    </div>


    <div class="grid2">

      <div class="card">

        <h2>Quick start</h2>

        <ol>

          <li>
            Click <b>New applicant</b>.
          </li>

          <li>
            Enter the applicant's name.
          </li>

          <li>
            Ask the five required questions.
          </li>

          <li>
            Write specific notes instead
            of relying on memory.
          </li>

          <li>
            Rate each category using
            evidence from the interview.
          </li>

          <li>
            Mark the interview complete
            and save.
          </li>

          <li>
            Export a backup before you
            leave the device.
          </li>

        </ol>

      </div>


      <div class="card">

        <h2>Important data rule</h2>

        <p>
          The website code can safely live
          on GitHub Pages, but
          <b>applicant data should never be
          committed to GitHub.</b>
        </p>

        <p>
          This app keeps records in the
          browser's IndexedDB. Browser data
          can still be erased by device
          resets, account changes, or
          school policies.
        </p>

        <button
          class="btn good"
          onclick="go('data')"
        >
          Open data safety guide &rarr;
        </button>

      </div>

    </div>


    <div
      class="card"
      style="margin-top:14px"
    >

      <h2>Recent applicants</h2>

      ${recentHTML()}

    </div>
    `;

}


function recentHTML(){

  const list =
    db.applicants
      .slice()
      .sort(
        (a,b)=>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      )
      .slice(0,7);

  if(!list.length){

    return `
      <div class="empty">
        No applicants yet.
        Start your first interview.
      </div>
    `;

  }

  return list.map(a=>`

    <div class="applicant">

      <div>

        <b>
          ${esc(a.name)}
        </b>

        <div class="muted">

          ${esc(a.grade || "No grade")}
          &bull;
          ${status(a)}
          &bull;
          Updated
          ${esc(dateText(a.updatedAt))}

        </div>

      </div>

      <div class="actions">

        <span
          class="pill ${a.completed ? "good" : "warn"}"
        >
          ${ratingAverage(a) || "\u2014"}/5
        </span>

        <button
          class="btn small"
          onclick="editApplicant('${a.id}')"
        >
          Open
        </button>

      </div>

    </div>

  `).join("");

}


/* =========================
   NEW INTERVIEW
========================= */

function startNew(){

  current = {

    id:uid(),

    name:"",

    grade:"",

    answers:Array(5).fill(""),

    ratings:{},

    notes:"",

    completed:false,

    createdAt:Date.now(),

    updatedAt:Date.now()

  };

  page = "interview";

  document
    .querySelectorAll("nav button")
    .forEach(button =>
      button.classList.toggle(
        "active",
        button.dataset.page === "interview"
      )
    );

  render();

}


function editApplicant(id){

  const applicant =
    db.applicants.find(
      a=>a.id === id
    );

  if(!applicant){
    return;
  }

  current =
    clone(applicant);

  page = "interview";

  document
    .querySelectorAll("nav button")
    .forEach(button =>
      button.classList.toggle(
        "active",
        button.dataset.page === "interview"
      )
    );

  render();

}


/* =========================
   INTERVIEW PAGE
========================= */

function interview(main){

  if(!current){

    startNew();

    return;

  }

  main.innerHTML =

    header(
      current.name
        ? `Interview: ${esc(current.name)}`
        : "New Interview",

      "Your work is saved when you press Save. Use the backup page for an independent copy.",

      `
        <button
          class="btn"
          onclick="go('applicants')"
        >
          Back to applicants
        </button>
      `
    )

    +

function setRating(index,number){

  current.ratings[index] =
    number;

  const rows =
    document.querySelectorAll(
      ".score-row"
    );

  if(rows[index]){

    rows[index]
      .querySelectorAll("button")
      .forEach(
        (button,position)=>{
          button.classList.toggle(
            "on",
            position < number
          );
        }
      );

  }

  const summary =
    document.getElementById(
      "ratingSummary"
    );

  if(summary){

    summary.innerHTML = `

      <b>
        Current average:
      </b>

      ${ratingAverage(current) || "\u2014"}
      / 5

      &nbsp;

      <span class="muted">

        (${ratingsCount(current)}/6
        categories rated)

      </span>

    `;

  }

}


async function saveInterview(markComplete){

  const name =
    document
      .getElementById("nm")
      .value
      .trim();

  if(!name){

    alert(
      "Please enter the applicant's name."
    );

    document
      .getElementById("nm")
      .focus();

    return false;

  }

  current.name = name;

  current.grade =
    document
      .getElementById("gr")
      .value
      .trim();

  current.answers =
    QUESTIONS.map(
      (_,index)=>
        document
          .getElementById("q"+index)
          .value
    );

  current.notes =
    document
      .getElementById("notes")
      .value;

  if(markComplete){

    current.completed =
      true;

  }

  current.updatedAt =
    Date.now();

  const saved =
    await persist(current);

  if(
    !db.applicants.some(
      a=>a.id === current.id
    )
  ){

    db.applicants.push(
      clone(current)
    );

  }else{

    db.applicants =
      db.applicants.map(
        a =>
          a.id === current.id
          ? clone(current)
          : a
      );

  }

  if(saved){

    toast(
      markComplete
        ? "Applicant marked complete and saved."
        : "Applicant saved."
    );

    if(markComplete){

      go("applicants");

    }

  }else{

    alert(
      "The browser could not save this applicant. Do not close this page. Use Backup & Data immediately and contact your school administrator if storage is restricted."
    );

  }

  return saved;

}


async function deleteCurrent(){

  if(
    !current ||
    !confirm(
      `Delete ${current.name || "this applicant"}? This cannot be undone unless you have a backup.`
    )
  ){

    return;

  }

  await removeApplicant(
    current.id
  );

  current = null;

  go("applicants");

}

function filterApplicants(){

  const query =
    (
      document
        .getElementById("search")
        ?.value ||
      ""
    ).toLowerCase();

  const filter =
    document
      .getElementById("filter")
      ?.value ||
    "all";

  let list =
    db.applicants.filter(
      applicant =>
        applicant.name
          .toLowerCase()
          .includes(query)
    );

  if(filter === "complete"){

    list =
      list.filter(
        applicant =>
          applicant.completed
      );

  }

  if(filter === "progress"){

    list =
      list.filter(
        applicant =>
          !applicant.completed
      );

  }

  list.sort(
    (a,b)=>
      a.name.localeCompare(
        b.name
      )
  );

  const output =
    document.getElementById(
      "alist"
    );

  if(!output){
    return;
  }

  output.innerHTML =
    list.length

    ?

    list.map(applicant=>`

      <div class="applicant">

        <div>

          <b>
            ${esc(applicant.name)}
          </b>

          <div class="muted">

            ${esc(
              applicant.grade ||
              "No grade"
            )}

            &bull;

            ${status(applicant)}

            &bull;

            ${ratingsCount(applicant)}/6
            rated

            &bull;

            ${esc(
              dateText(
                applicant.updatedAt
              )
            )}

          </div>

        </div>


        <div class="actions">

          <span
            class="pill ${
              applicant.completed
              ? "good"
              : "warn"
            }"
          >
            ${ratingAverage(applicant) || "\u2014"}/5
          </span>


          <button
            class="btn small"
            onclick="editApplicant('${applicant.id}')"
          >
            Edit
          </button>


          <button
            class="btn small danger"
            onclick="deleteById('${applicant.id}')"
          >
            Delete
          </button>

        </div>

      </div>

    `).join("")

    :

    `
      <div class="empty">
        No matching applicants.
      </div>
    `;

}


async function deleteById(id){

  const applicant =
    db.applicants.find(
      a=>a.id === id
    );

  if(!applicant){
    return;
  }

  if(
    !confirm(
      `Delete ${applicant.name}? This cannot be undone unless you have a backup.`
    )
  ){

    return;

  }

  await removeApplicant(id);

  toast(
    "Applicant deleted."
  );

  filterApplicants();

}

function exportJSON(){

  const payload = {

    app:
      "Science Olympiad Interview HQ",

    formatVersion:
      2,

    exportedAt:
      new Date().toISOString(),

    applicants:
      db.applicants

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          payload,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  link.href = url;

  link.download =
    "science-olympiad-backup-" +
    new Date()
      .toISOString()
      .slice(0,10) +
    ".json";


  document.body.appendChild(link);

  link.click();

  link.remove();


  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );


  localStorage.setItem(
    "sciOlyLastBackupAt",
    String(Date.now())
  );


  toast(
    "JSON backup downloaded."
  );


  if(page === "data"){

    setTimeout(
      render,
      200
    );

  }

}


/* =========================
   IMPORT (merge, multi-file)
========================= */

function cleanApplicant(applicant){

  return {

    id:
      String(
        applicant.id ||
        uid()
      ),

    name:
      String(
        applicant.name ||
        ""
      ).trim(),

    grade:
      String(
        applicant.grade ||
        ""
      ),

    answers:
      Array.isArray(
        applicant.answers
      )
      ?
      QUESTIONS.map(
        (_,index)=>
          String(
            applicant
              .answers[index] ||
            ""
          )
      )
      :
      Array(5).fill(""),

    ratings:
      applicant.ratings &&
      typeof applicant.ratings === "object"
      ?
      applicant.ratings
      :
      {},

    notes:
      String(
        applicant.notes ||
        ""
      ),

    completed:
      Boolean(
        applicant.completed
      ),

    createdAt:
      Number(
        applicant.createdAt
      ) ||
      Date.now(),

    updatedAt:
      Number(
        applicant.updatedAt
      ) ||
      Date.now()

  };

}


async function readApplicantsFromFile(file){

  const text =
    await file.text();

  const data =
    JSON.parse(text);

  if(
    !data ||
    !Array.isArray(
      data.applicants
    )
  ){

    throw new Error(
      "Invalid backup: " +
      file.name
    );

  }

  return data.applicants
    .map(cleanApplicant)
    .filter(
      applicant =>
        applicant.name
    );

}


async function importJSON(event){

  const files =
    Array.from(
      event.target.files || []
    );

  if(!files.length){
    return;
  }


  const merged = new Map();

  // start with everything already saved in this browser
  for(const applicant of db.applicants){
    merged.set(applicant.id, applicant);
  }

  const failedFiles = [];
  let filesRead = 0;
  let incomingCount = 0;

  for(const file of files){

    try{

      const fromFile =
        await readApplicantsFromFile(file);

      filesRead++;
      incomingCount += fromFile.length;

      for(const applicant of fromFile){

        const existing =
          merged.get(applicant.id);

        // if this id is already present (from the browser or an
        // earlier file in this same import), keep whichever
        // version was updated more recently
        if(
          !existing ||
          (applicant.updatedAt || 0) >=
          (existing.updatedAt || 0)
        ){

          merged.set(
            applicant.id,
            applicant
          );

        }

      }

    }catch{

      failedFiles.push(file.name);

    }

  }


  if(!filesRead){

    alert(
      "None of the selected files looked like a valid Science Olympiad Interview HQ backup."
    );

    event.target.value = "";

    return;

  }


  const mergedList =
    Array.from(merged.values());

  const newCount =
    mergedList.length -
    db.applicants.length;

  let message =
    `Import from ${filesRead} file(s) ` +
    `containing ${incomingCount} applicant record(s)? ` +
    `Your current ${db.applicants.length} applicant(s) ` +
    `will be kept, and the result will be ` +
    `${mergedList.length} applicant(s) total ` +
    `(duplicates are merged by keeping the most ` +
    `recently updated version).`;

  if(failedFiles.length){

    message +=
      `\n\nNote: ${failedFiles.length} file(s) ` +
      `could not be read and were skipped: ` +
      failedFiles.join(", ");

  }


  if(!confirm(message)){

    event.target.value = "";

    return;

  }


  try{

    const saved =
      await replaceAll(mergedList);

    if(!saved){

      throw new Error(
        "Could not save"
      );

    }

    toast(
      newCount > 0
        ? `Backup merged in. ${newCount} new applicant(s) added.`
        : "Backup merged in."
    );

    go("applicants");

  }catch{

    alert(
      "The browser could not save the merged records."
    );

  }finally{

    event.target.value = "";

  }

}


/* =========================
   ERASE
========================= */

async function eraseAll(){

  if(!db.applicants.length){

    alert(
      "There are no applicant records to erase."
    );

    return;

  }


  if(
    !confirm(
      "ERASE ALL APPLICANT RECORDS from this browser? This cannot be undone without a backup."
    )
  ){

    return;

  }


  if(
    !confirm(
      "Final confirmation: have you exported a backup? Click OK only if you are certain."
    )
  ){

    return;

  }


  const success =
    await replaceAll([]);


  if(success){

    toast(
      "All browser records erased."
    );

    go("dashboard");

  }else{

    alert(
      "The browser did not allow the records to be erased."
    );

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const main =
    document.getElementById(
      "main"
    );


  if(page === "dashboard"){
    dashboard(main);
  }

  else if(page === "interview"){
    interview(main);
  }

  else if(page === "applicants"){
    applicants(main);
  }

  else if(page === "guide"){
    guide(main);
  }

  else if(page === "data"){
    dataPage(main);
  }

}


/* =========================
   START
========================= */

(async function(){

  await loadData();

  render();

})();

</script>
