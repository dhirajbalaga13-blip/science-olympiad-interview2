<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Olympiad Interview HQ</title>

<style>
:root{
    --bg:#f5f1e8;
    --card:#fffdf8;
    --sidebar:#173b2b;
    --sidebar2:#204d38;
    --primary:#2f6b4f;
    --primary-dark:#24533d;
    --gold:#c79b3b;
    --gold-light:#f5ead0;
    --text:#243129;
    --muted:#6c756f;
    --border:#ded8ca;
    --danger:#b84b42;
    --danger-light:#fff0ee;
    --success:#39734f;
    --success-light:#e9f4ec;
    --warning:#9b7220;
    --warning-light:#fff7df;
    --shadow:0 5px 22px rgba(40,45,35,.07);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:grid;
    grid-template-columns:245px 1fr;
}

.sidebar{
    background:var(--sidebar);
    color:white;
    padding:27px 18px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
}

.brand{
    padding:0 10px 25px;
}

.brand h1{
    margin:0;
    font-size:21px;
    line-height:1.15;
    letter-spacing:-.3px;
}

.brand p{
    margin:7px 0 0;
    color:#bcd0c2;
    font-size:13px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.nav-btn{
    width:100%;
    text-align:left;
    border:0;
    background:transparent;
    color:#dbe7df;
    border-radius:9px;
    padding:11px 12px;
    transition:.15s;
}

.nav-btn:hover{
    background:rgba(255,255,255,.08);
}

.nav-btn.active{
    background:#f5f1e8;
    color:var(--sidebar);
    font-weight:750;
}

.side-note{
    margin:28px 7px 0;
    padding:14px;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.05);
    border-radius:9px;
    color:#c8d6cd;
    font-size:12px;
    line-height:1.55;
}

.main{
    min-width:0;
}

.content{
    max-width:1180px;
    margin:0 auto;
    padding:35px 38px 60px;
}

.view-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:25px;
}

.view-eyebrow{
    color:var(--gold);
    font-size:11px;
    font-weight:800;
    letter-spacing:1.2px;
    margin-bottom:7px;
}

.view-title{
    margin:0;
    font-size:30px;
    line-height:1.15;
    letter-spacing:-.7px;
}

.view-sub{
    margin:8px 0 0;
    color:var(--muted);
    max-width:700px;
    line-height:1.5;
    font-size:14px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
}

.card h2,
.card h3{
    margin-top:0;
}

.grid-2{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:17px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
    margin-bottom:20px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:11px;
    padding:17px;
}

.stat-number{
    font-size:27px;
    font-weight:800;
    margin-bottom:3px;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
}

.btn-row{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    align-items:center;
}

.btn{
    border:1px solid var(--border);
    background:white;
    color:var(--text);
    border-radius:8px;
    padding:9px 13px;
    font-weight:650;
    font-size:13px;
    transition:.15s;
}

.btn:hover{
    transform:translateY(-1px);
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.btn-primary{
    background:var(--primary);
    border-color:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-gold{
    background:var(--gold);
    border-color:var(--gold);
    color:white;
}

.btn-ghost{
    background:transparent;
}

.btn-danger{
    color:var(--danger);
    border-color:#e5b5b0;
    background:white;
}

.btn-sm{
    padding:7px 10px;
    font-size:12px;
}

label{
    display:block;
    font-size:12px;
    font-weight:750;
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    background:white;
    color:var(--text);
    padding:10px 11px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(47,107,79,.1);
}

textarea{
    min-height:115px;
    resize:vertical;
    line-height:1.5;
}

.field{
    margin-bottom:15px;
}

.muted{
    color:var(--muted);
}

.small{
    font-size:12px;
}

.hint{
    color:var(--muted);
    font-size:12px;
    line-height:1.55;
}

.banner{
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:center;
}

.banner-accent{
    background:var(--gold-light);
    border-color:#e5d2a4;
}

.info-box{
    padding:13px 15px;
    border-radius:9px;
    background:#edf5ef;
    border:1px solid #c8ddcc;
    color:#35523e;
    font-size:13px;
    line-height:1.5;
}

.warning-box{
    padding:13px 15px;
    border-radius:9px;
    background:var(--warning-light);
    border:1px solid #e6d29a;
    color:#6f581f;
    font-size:13px;
    line-height:1.5;
}

.danger-box{
    padding:13px 15px;
    border-radius:9px;
    background:var(--danger-light);
    border:1px solid #e6bbb6;
    color:#743d39;
    font-size:13px;
    line-height:1.5;
}

.applicant-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto auto;
    align-items:center;
    gap:15px;
    padding:15px 2px;
    border-bottom:1px solid var(--border);
}

.applicant-row:last-child{
    border-bottom:0;
}

.applicant-name{
    font-weight:800;
    margin-bottom:4px;
}

.applicant-meta{
    color:var(--muted);
    font-size:12px;
}

.badge{
    display:inline-block;
    border-radius:999px;
    padding:5px 9px;
    font-size:11px;
    font-weight:800;
}

.badge-success{
    background:var(--success-light);
    color:var(--success);
}

.badge-warning{
    background:var(--warning-light);
    color:var(--warning);
}

.badge-neutral{
    background:#edf0ed;
    color:#5e6962;
}

.score{
    min-width:70px;
    text-align:right;
    font-weight:800;
}

.search-row{
    display:grid;
    grid-template-columns:1fr 170px;
    gap:10px;
    margin-bottom:12px;
}

.empty{
    text-align:center;
    padding:32px 15px;
    color:var(--muted);
}

.stepper{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:19px;
}

.step{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    font-size:12px;
    font-weight:750;
}

.step-number{
    width:27px;
    height:27px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#e2e3dc;
    color:#687069;
}

.step.active{
    color:var(--primary);
}

.step.active .step-number{
    background:var(--primary);
    color:white;
}

.step.done .step-number{
    background:var(--gold);
    color:white;
}

.question-number{
    color:var(--gold);
    font-size:12px;
    font-weight:800;
    letter-spacing:.8px;
    margin-bottom:7px;
}

.question-text{
    font-size:23px;
    line-height:1.3;
    font-weight:800;
    margin-bottom:8px;
}

.question-help{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    margin-bottom:18px;
}

.rating-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:20px;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid var(--border);
}

.rating-row:last-child{
    border-bottom:0;
}

.rating-title{
    font-weight:800;
    margin-bottom:4px;
}

.rating-description{
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
}

.rating-buttons{
    display:flex;
    gap:5px;
}

.rating-button{
    width:36px;
    height:36px;
    border:1px solid var(--border);
    background:white;
    color:#677067;
    border-radius:7px;
    font-weight:800;
}

.rating-button.selected{
    background:var(--primary);
    border-color:var(--primary);
    color:white;
}

.checkbox-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
}

.check-item{
    border:1px solid var(--border);
    background:white;
    border-radius:8px;
    padding:10px;
    display:flex;
    gap:9px;
    align-items:flex-start;
}

.check-item input{
    width:auto;
    margin-top:2px;
}

.check-item span{
    font-size:12px;
    line-height:1.4;
}

.review-item{
    padding:12px 0;
    border-bottom:1px solid var(--border);
}

.review-item:last-child{
    border-bottom:0;
}

.review-label{
    font-size:11px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-bottom:4px;
}

.file-drop{
    border:2px dashed #c9c7bb;
    border-radius:10px;
    padding:28px 20px;
    text-align:center;
    background:#faf8f1;
}

.file-drop:hover{
    border-color:var(--primary);
    background:#f4f8f3;
}

.file-drop h3{
    margin-bottom:6px;
}

.merge-summary{
    margin-top:18px;
}

.merge-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:9px;
}

.merge-stat{
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    background:white;
}

.merge-stat strong{
    display:block;
    font-size:20px;
    margin-bottom:2px;
}

.guide-section{
    margin-bottom:27px;
}

.guide-section:last-child{
    margin-bottom:0;
}

.guide-section h3{
    margin-bottom:7px;
}

.guide-section p,
.guide-section li{
    color:#48534c;
    font-size:13px;
    line-height:1.6;
}

.guide-section ul,
.guide-section ol{
    padding-left:22px;
}

.rating-guide{
    display:grid;
    grid-template-columns:70px 1fr;
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
}

.rating-guide > div{
    padding:10px;
    border-bottom:1px solid var(--border);
}

.rating-guide > div:nth-last-child(-n+2){
    border-bottom:0;
}

.rating-num{
    text-align:center;
    font-weight:800;
    background:#f7f6ef;
}

.kv{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:11px 0;
    border-bottom:1px solid var(--border);
}

.kv:last-child{
    border-bottom:0;
}

.danger-zone{
    border:1px solid #e6bbb6;
    background:#fff8f6;
}

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(20,30,24,.48);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal{
    width:min(760px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:var(--card);
    border-radius:13px;
    padding:22px;
    box-shadow:0 20px 65px rgba(0,0,0,.22);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:14px;
}

.modal-header h2{
    margin:0;
}

.close-btn{
    border:0;
    background:transparent;
    font-size:23px;
    color:var(--muted);
}

.toast{
    position:fixed;
    right:18px;
    bottom:18px;
    background:#173b2b;
    color:white;
    padding:12px 15px;
    border-radius:9px;
    box-shadow:0 7px 25px rgba(0,0,0,.18);
    z-index:200;
    max-width:380px;
    font-size:13px;
}

.mobile-nav{
    display:none;
}

@media(max-width:950px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .merge-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:850px){
    .app{
        display:block;
    }

    .sidebar{
        display:none;
    }

    .mobile-nav{
        display:flex;
        gap:5px;
        overflow-x:auto;
        padding:8px;
        background:var(--sidebar);
    }

    .mobile-nav button{
        white-space:nowrap;
        border:0;
        background:var(--sidebar2);
        color:white;
        border-radius:7px;
        padding:8px 10px;
        font-size:12px;
    }

    .mobile-nav button.active{
        background:#f5f1e8;
        color:var(--sidebar);
    }

    .content{
        padding:20px 16px 45px;
    }

    .grid-2,
    .grid-3,
    .checkbox-grid{
        grid-template-columns:1fr;
    }

    .applicant-row{
        grid-template-columns:1fr;
        align-items:flex-start;
    }

    .score{
        text-align:left;
    }

    .search-row{
        grid-template-columns:1fr;
    }
}

@media(max-width:560px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    .view-title{
        font-size:25px;
    }

    .view-head{
        flex-direction:column;
    }

    .rating-row{
        grid-template-columns:1fr;
    }

    .rating-buttons{
        width:100%;
    }

    .rating-button{
        flex:1;
    }

    .merge-grid{
        grid-template-columns:1fr 1fr;
    }

    .banner{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <h1>Science Olympiad</h1>
            <p>Interview HQ</p>
        </div>

        <nav class="nav">
            <button class="nav-btn active" data-page="dashboard">🏠 Dashboard</button>
            <button class="nav-btn" data-page="interview">➕ New Interview</button>
            <button class="nav-btn" data-page="applicants">👥 Applicants</button>

            <br><br>
            Records are saved in this browser.
            They are not stored in this GitHub repository.
            Export a JSON backup regularly.
        </div>
    </aside>

    <div class="main">

        <div class="mobile-nav">
            <button data-page="dashboard" class="active">Dashboard</button>
            <button data-page="interview">New Interview</button>
            <button data-page="applicants">Applicants</button>
            <button data-page="guide">Guide</button>
            <button data-page="data">Backups</button>
        </div>

        <main class="content" id="main"></main>

    </div>
</div>

<input
    type="file"
    id="importFileInput"
    accept="application/json,.json"
    multiple
    hidden
>

<div id="modalRoot"></div>

<script>
"use strict";

/* ============================================================
   SCIENCE OLYMPIAD INTERVIEW HQ
   ============================================================ */

const DB_NAME = "ScienceOlympiadInterviewHQ";
const DB_VERSION = 1;
const STORE_NAME = "applicants";
const FALLBACK_KEY = "sciOlyInterviewHQ_fallback_v3";
const DRAFT_KEY = "sciOlyInterviewHQ_draft_v3";
const META_KEY = "sciOlyInterviewHQ_meta_v3";

const QUESTIONS = [
    {
        text:"What made you want to join Science Olympiad?",
        help:"Look for genuine motivation and whether the applicant can explain what interests them."
    },
    {
        text:"What's something you're genuinely obsessed with outside of school?",
        help:"Look for curiosity, enthusiasm, depth of interest, and the ability to explain why something matters to them."
    },
    {
        text:"Tell me about a time something you worked on didn't go the way you planned. What did you do?",
        help:"Look for problem solving, reflection, persistence, adaptability, and what the applicant learned."
    },
    {
        text:"If you could add any event to Science Olympiad that doesn't exist, what would it be and why?",
        help:"Look for creativity and the reasoning behind the idea rather than whether the idea itself is technically perfect."
    },
    {
        text:"What would make this year's team different from last year in your opinion?",
        help:"Look for teamwork awareness, ideas about improvement, and whether the applicant thinks beyond themselves."
    }
];

const RATING_CATEGORIES = [
    {
        key:"interest",
        title:"Interest & motivation",
        description:"How convincingly does the applicant demonstrate that they want to participate?"
    },
    {
        key:"curiosity",
        title:"Curiosity & passion",
        description:"Does the applicant show genuine curiosity or enthusiasm about things they care about?"
    },
    {
        key:"problemSolving",
        title:"Problem solving",
        description:"How well do they describe working through setbacks or difficult situations?"
    },
    {
        key:"creativity",
        title:"Creativity",
        description:"Do they generate interesting ideas or approach problems from different angles?"
    },
    {
        key:"teamFit",
        title:"Team fit",
        description:"Do they demonstrate behaviors that could contribute positively to a team?"
    },
    {
        key:"communication",
        title:"Communication",
        description:"How effectively do they explain their thoughts and experiences?"
    }
];

const OBSERVATIONS = [
    "Engaged and attentive",
    "Gave specific examples",
    "Asked thoughtful questions",
    "Explained ideas clearly",
    "Showed enthusiasm",
    "Comfortable collaborating",
    "Needed occasional prompting",
    "Reflected thoughtfully on mistakes"
];

let applicants = [];
let currentPage = "dashboard";
let currentInterview = null;
let currentStep = 0;
let usingIndexedDB = false;
let idb = null;
let toastTimer = null;
let meta = {
    lastBackupAt:null
};

/* ============================================================
   UTILITIES
   ============================================================ */

function uid(){
    if(window.crypto && crypto.randomUUID){
        return crypto.randomUUID();
    }

    return "a-" +
        Date.now() +
        "-" +
        Math.random().toString(16).slice(2);
}

function escapeHTML(value){
    return String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[character])
    );
}

function clone(value){
    return JSON.parse(JSON.stringify(value));
}

function todayStr(){
    const d = new Date();

    const pad = n => n < 10 ? "0" + n : String(n);

    return d.getFullYear() +
        "-" +
        pad(d.getMonth() + 1) +
        "-" +
        pad(d.getDate());
}

function validDate(value){
    if(!value){
        return false;
    }

    return !Number.isNaN(Date.parse(value));
}

function normalizeName(name){
    return String(name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"")
        .trim();
}

function formatDate(value){
    if(!value){
        return "—";
    }

    const d = new Date(value);

    if(Number.isNaN(d.getTime())){
        return "—";
    }

    return d.toLocaleDateString(undefined,{
        year:"numeric",
        month:"short",
        day:"numeric"
    });
}

function daysSince(value){
    if(!value){
        return 0;
    }

    const diff =
        Date.now() -
        new Date(value).getTime();

    return Math.max(
        0,
        Math.floor(diff / 86400000)
    );
}

function showToast(message){
    let el = document.getElementById("toast");

    if(!el){
        el = document.createElement("div");
        el.id = "toast";
        el.className = "toast";
        document.body.appendChild(el);
    }

    el.textContent = message;
    el.style.display = "block";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        el.style.display = "none";
    },3500);
}

function ratingAverage(ratings){
    const values = Object.values(ratings || {})
        .map(Number)
        .filter(value => value >= 1 && value <= 5);

    if(!values.length){
        return null;
    }

    return values.reduce((a,b) => a + b,0) / values.length;
}

function statusOf(applicant){
    if(applicant.status){
        return applicant.status;
    }

    return applicant.completed
        ? "Complete"
        : "Incomplete";
}

function scoreOf(applicant){
    return ratingAverage(applicant.ratings);
}

/* ============================================================
   STORAGE
   ============================================================ */

function openDatabase(){
    return new Promise((resolve,reject) => {
        const request =
            indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = event => {
            const database = event.target.result;

            if(!database.objectStoreNames.contains(STORE_NAME)){
                database.createObjectStore(
                    STORE_NAME,
                    {keyPath:"id"}
                );
            }
        };

        request.onsuccess = event => {
            resolve(event.target.result);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

function idbGetAll(){
    return new Promise((resolve,reject) => {
        const transaction =
            idb.transaction(STORE_NAME,"readonly");

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.getAll();

        request.onsuccess = () => {
            resolve(request.result || []);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

function idbPutAll(records){
    return new Promise((resolve,reject) => {
        const transaction =
            idb.transaction(STORE_NAME,"readwrite");

        const store =
            transaction.objectStore(STORE_NAME);

        transaction.oncomplete = () => resolve(true);
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);

        records.forEach(record => {
            store.put(record);
        });
    });
}

function idbReplaceAll(records){
    return new Promise((resolve,reject) => {
        const transaction =
            idb.transaction(STORE_NAME,"readwrite");

        const store =
            transaction.objectStore(STORE_NAME);

        store.clear();

        records.forEach(record => {
            store.put(record);
        });

        transaction.oncomplete = () => resolve(true);
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
    });
}

async function initializeStorage(){
    if(!window.indexedDB){
        usingIndexedDB = false;
        return;
    }

    try{
        idb = await openDatabase();
        usingIndexedDB = true;
    }catch(error){
        console.warn("IndexedDB unavailable:",error);
        usingIndexedDB = false;
    }
}

async function loadApplicants(){
    if(usingIndexedDB){
        try{
            applicants = await idbGetAll();
            return;
        }catch(error){
            console.warn("IndexedDB read failed:",error);
            usingIndexedDB = false;
        }
    }

    try{
        const saved =
            localStorage.getItem(FALLBACK_KEY);

        applicants =
            saved ? JSON.parse(saved) : [];
    }catch(error){
        console.error(error);
        applicants = [];
    }
}

async function saveApplicants(){
    if(usingIndexedDB){
        try{
            await idbReplaceAll(applicants);
            return true;
        }catch(error){
            console.warn("IndexedDB save failed:",error);
            usingIndexedDB = false;
        }
    }

    try{
        localStorage.setItem(
            FALLBACK_KEY,
            JSON.stringify(applicants)
        );

        return true;
    }catch(error){
        console.error(error);
        return false;
    }
}

async function replaceAll(records){
    applicants = records;

    return await saveApplicants();
}

function loadMeta(){
    try{
        const saved =
            localStorage.getItem(META_KEY);

        if(saved){
            meta = {
                ...meta,
                ...JSON.parse(saved)
            };
        }
    }catch(error){
        console.warn(error);
    }
}

function saveMeta(){
    try{
        localStorage.setItem(
            META_KEY,
            JSON.stringify(meta)
        );
    }catch(error){
        console.warn(error);
    }
}

/* ============================================================
   APPLICANT NORMALIZATION
   ============================================================ */

function normalizeApplicant(record){
    const normalized = {
        id:String(record.id || uid()),

        name:String(
            record.name || ""
        ).trim(),

        grade:String(
            record.grade || ""
        ),

        interviewDate:
            record.interviewDate || "",

        answers:
            Array.isArray(record.answers)
                ? QUESTIONS.map(
                    (_,index) =>
                        String(
                            record.answers[index] || ""
                        )
                )
                : QUESTIONS.map(() => ""),

        ratings:{},

        observations:
            Array.isArray(record.observations)
                ? record.observations.map(String)
                : [],

        notes:String(
            record.notes || ""
        ),

        completed:Boolean(
            record.completed ||
            record.status === "Complete"
        ),

        status:
            record.status ||
            (
                record.completed
                    ? "Complete"
                    : "Incomplete"
            ),

        createdAt:
            validDate(record.createdAt)
                ? record.createdAt
                : new Date().toISOString(),

        updatedAt:
            validDate(record.updatedAt)
                ? record.updatedAt
                : validDate(record.createdAt)
                    ? record.createdAt
                    : new Date().toISOString()
    };

    RATING_CATEGORIES.forEach(category => {
        const value =
            record.ratings &&
            typeof record.ratings === "object"
                ? record.ratings[category.key]
                : undefined;

        if(
            value !== undefined &&
            Number(value) >= 1 &&
            Number(value) <= 5
        ){
            normalized.ratings[category.key] =
                Number(value);
        }
    });

    return normalized;
}

function normalizeImportedData(data){
    if(!data){
        throw new Error("The file is empty.");
    }

    let records;

    /*
       Supports the current backup format:
       {
         app,
         formatVersion,
         exportedAt,
         applicants:[...]
       }

       Also supports a raw applicant array for compatibility.
    */

    if(Array.isArray(data)){
        records = data;
    }else if(Array.isArray(data.applicants)){
        records = data.applicants;
    }else{
        throw new Error(
            "This does not contain an applicants array."
        );
    }

    return records
        .filter(
            record =>
                record &&
                typeof record === "object"
        )
        .map(normalizeApplicant)
        .filter(
            applicant =>
                applicant.name.trim().length > 0
        );
}

/* ============================================================
   INTERVIEW WIZARD
   ============================================================ */

function createEmptyInterview(){
    return {
        id:uid(),
        name:"",
        grade:"",
        interviewDate:todayStr(),
        answers:QUESTIONS.map(() => ""),
        ratings:{},
        observations:[],
        notes:"",
        completed:false,
        status:"Incomplete",
        createdAt:new Date().toISOString(),
        updatedAt:new Date().toISOString()
    };
}

function startNewInterview(){
    const draft = getDraft();

    if(draft){
        if(
            !confirm(
                `You have an unfinished interview for ${
                    draft.name || "an applicant"
                }.\n\nStarting a new interview will discard that draft. Continue?`
            )
        ){
            return;
        }

        clearDraft();
    }

    currentInterview = createEmptyInterview();
    currentStep = 0;
    currentPage = "interview";

    updateNav();
    render();
}

function editApplicant(id){
    const applicant =
        applicants.find(
            applicant => applicant.id === id
        );

    if(!applicant){
        return;
    }

    currentInterview = clone(applicant);
    currentStep = 0;
    currentPage = "interview";

    updateNav();
    render();
}

function getDraft(){
    try{
        const raw =
            localStorage.getItem(DRAFT_KEY);

        return raw
            ? JSON.parse(raw)
            : null;
    }catch(error){
        return null;
    }
}

function saveDraft(){
    if(!currentInterview){
        return;
    }

    try{
        currentInterview.updatedAt =
            new Date().toISOString();

        localStorage.setItem(
            DRAFT_KEY,
            JSON.stringify(currentInterview)
        );
    }catch(error){
        console.warn("Could not save draft:",error);
    }
}

function clearDraft(){
    localStorage.removeItem(DRAFT_KEY);
}

function resumeDraft(){
    const draft = getDraft();

    if(!draft){
        return;
    }

    currentInterview = draft;
    currentStep = 0;
    currentPage = "interview";

    updateNav();
    render();
}

function discardDraft(){
    if(
        confirm(
            "Discard this unfinished interview?"
        )
    ){
        clearDraft();
        render();
    }
}

function updateNav(){
    document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.page === currentPage
        );
    });

    document.querySelectorAll(".mobile-nav button").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.page === currentPage
        );
    });
}

function updateInterviewField(field,value){
    if(!currentInterview){
        return;
    }

    currentInterview[field] = value;
    saveDraft();
}

function updateAnswer(index,value){
    if(!currentInterview){
        return;
    }

    currentInterview.answers[index] = value;
    saveDraft();
}

function setRating(key,value){
    if(!currentInterview){
        return;
    }

    currentInterview.ratings[key] = value;
    saveDraft();
    renderInterview();
}

function toggleObservation(observation){
    if(!currentInterview){
        return;
    }

    const index =
        currentInterview.observations.indexOf(
            observation
        );

    if(index >= 0){
        currentInterview.observations.splice(index,1);
    }else{
        currentInterview.observations.push(
            observation
        );
    }

    saveDraft();
    renderInterview();
}

function renderInterview(){
    if(!currentInterview){
        currentInterview = createEmptyInterview();
    }

    const stepNames = [
        "Applicant",
        "Questions",
        "Ratings",
        "Observations",
        "Review"
    ];

    const steps = stepNames.map(
        (name,index) => `
            <div class="step ${
                index === currentStep
                    ? "active"
                    : index < currentStep
                        ? "done"
                        : ""
            }">
                <div class="step-number">
                    ${index + 1}
                </div>
                <span>${name}</span>
            </div>
        `
    ).join("");

    let body = "";

    if(currentStep === 0){
        body = `
            <div class="card">
                <div class="view-eyebrow">STEP 1</div>
                <h2>Applicant information</h2>

                <div class="grid-2">
                    <div class="field">
                        <label>Applicant name *</label>
                        <input
                            id="interviewName"
                            value="${escapeHTML(currentInterview.name)}"
                            oninput="updateInterviewField('name',this.value)"
                            placeholder="Full name"
                            autofocus
                        >
                    </div>

                    <div class="field">
                        <label>Grade</label>
                        <input
                            value="${escapeHTML(currentInterview.grade)}"
                            oninput="updateInterviewField('grade',this.value)"
                            placeholder="e.g. 9"
                        >
                    </div>
                </div>

                <div class="field">
                    <label>Interview date</label>
                    <input
                        type="date"
                        value="${escapeHTML(currentInterview.interviewDate)}"
                        onchange="updateInterviewField('interviewDate',this.value)"
                    >
                </div>

                <div class="info-box">
                    Enter the applicant information first.
                    Your progress is automatically saved as a draft
                    while you work.
                </div>
            </div>
        `;
    }

    if(currentStep === 1){
        const index =
            currentInterview.currentQuestion || 0;

        const qIndex =
            Math.max(
                0,
                Math.min(
                    QUESTIONS.length - 1,
                    Number(index)
                )
            );

        body = `
            <div class="card">
                <div class="question-number">
                    QUESTION ${qIndex + 1} OF ${QUESTIONS.length}
                </div>

                <div class="question-text">
                    ${escapeHTML(
                        QUESTIONS[qIndex].text
                    )}
                </div>

                <div class="question-help">
                    ${escapeHTML(
                        QUESTIONS[qIndex].help
                    )}
                </div>

                <textarea
                    id="questionAnswer"
                    oninput="updateAnswer(${qIndex},this.value)"
                    placeholder="Write down the applicant's answer..."
                >${escapeHTML(
                    currentInterview.answers[qIndex] || ""
                )}</textarea>

                <div
                    class="btn-row"
                    style="margin-top:14px;"
                >
                    ${QUESTIONS.map(
                        (_,i) => `
                            <button
                                class="btn btn-sm ${
                                    i === qIndex
                                        ? "btn-primary"
                                        : ""
                                }"
                                onclick="jumpQuestion(${i})"
                            >
                                ${i + 1}
                            </button>
                        `
                    ).join("")}
                </div>
            </div>
        `;
    }

    if(currentStep === 2){
        body = `
            <div class="card">
                <div class="view-eyebrow">STEP 3</div>
                <h2>Rate the interview</h2>

                <p class="hint">
                    Use the same rubric for every applicant.
                    A rating of 1 is very weak and 5 is exceptional.
                </p>

                ${
                    RATING_CATEGORIES.map(
                        category => `
                            <div class="rating-row">
                                <div>
                                    <div class="rating-title">
                                        ${escapeHTML(category.title)}
                                    </div>

                                    <div class="rating-description">
                                        ${escapeHTML(category.description)}
                                    </div>
                                </div>

                                <div class="rating-buttons">
                                    ${[1,2,3,4,5].map(
                                        value => `
                                            <button
                                                type="button"
                                                class="rating-button ${
                                                    Number(
                                                        currentInterview
                                                            .ratings[
                                                                category.key
                                                            ]
                                                    ) === value
                                                        ? "selected"
                                                        : ""
                                                }"
                                                onclick="setRating(
                                                    '${category.key}',
                                                    ${value}
                                                )"
                                            >
                                                ${value}
                                            </button>
                                        `
                                    ).join("")}
                                </div>
                            </div>
                        `
                    ).join("")
                }
            </div>
        `;
    }

    if(currentStep === 3){
        body = `
            <div class="card">
                <div class="view-eyebrow">STEP 4</div>
                <h2>Interview observations</h2>

                <p class="hint">
                    These are contextual observations, not a personality
                    score. Avoid treating eye contact, nervousness, or
                    speaking style as evidence of ability by themselves.
                </p>

                <div class="checkbox-grid">
                    ${OBSERVATIONS.map(
                        observation => `
                            <label class="check-item">
                                <input
                                    type="checkbox"
                                    ${
                                        currentInterview.observations.includes(
                                            observation
                                        )
                                            ? "checked"
                                            : ""
                                    }
                                    onchange="toggleObservation(
                                        '${escapeHTML(observation)
                                            .replace(/'/g,"&#39;")}'
                                    "
                                >

                                <span>
                                    ${escapeHTML(observation)}
                                </span>
                            </label>
                        `
                    ).join("")}
                </div>

                <div class="field" style="margin-top:18px;">
                    <label>Additional notes</label>

                    <textarea
                        oninput="updateInterviewField('notes',this.value)"
                        placeholder="Anything else worth remembering..."
                    >${escapeHTML(
                        currentInterview.notes
                    )}</textarea>
                </div>
            </div>
        `;
    }

    if(currentStep === 4){
        const average =
            scoreOf(currentInterview);

        body = `
            <div class="card">
                <div class="view-eyebrow">STEP 5</div>
                <h2>Review interview</h2>

                <div class="review-item">
                    <div class="review-label">Applicant</div>
                    <strong>
                        ${escapeHTML(
                            currentInterview.name ||
                            "No name entered"
                        )}
                    </strong>
                </div>

                <div class="review-item">
                    <div class="review-label">Grade</div>
                    ${escapeHTML(
                        currentInterview.grade || "—"
                    )}
                </div>

                <div class="review-item">
                    <div class="review-label">Interview date</div>
                    ${escapeHTML(
                        currentInterview.interviewDate || "—"
                    )}
                </div>

                <div class="review-item">
                    <div class="review-label">Overall rating</div>
                    <strong>
                        ${
                            average !== null
                                ? average.toFixed(2) + " / 5"
                                : "Not rated"
                        }
                    </strong>
                </div>

                <div class="review-item">
                    <div class="review-label">Questions answered</div>
                    ${
                        currentInterview.answers.filter(
                            answer =>
                                String(answer).trim()
                        ).length
                    }
                    / ${QUESTIONS.length}
                </div>

                <div class="review-item">
                    <div class="review-label">Observations</div>
                    ${
                        currentInterview.observations.length
                            ? currentInterview.observations
                                .map(escapeHTML)
                                .join(", ")
                            : "None"
                    }
                </div>

                <div class="review-item">
                    <div class="review-label">Notes</div>
                    <div style="white-space:pre-wrap;">
                        ${escapeHTML(
                            currentInterview.notes || "None"
                        )}
                    </div>
                </div>

                <div class="info-box" style="margin-top:18px;">
                    Saving this interview will add it to your
                    applicant roster. You can edit it later.
                </div>
            </div>
        `;
    }

    document.getElementById("main").innerHTML = `
        <div class="view-head">
            <div>
                <div class="view-eyebrow">
                    ${currentInterview.id ? "INTERVIEW" : "NEW"}
                </div>

                <h1 class="view-title">
                    ${currentInterview.name
                        ? escapeHTML(currentInterview.name)
                        : "New Interview"}
                </h1>

                <p class="view-sub">
                    Progress saves automatically in this browser.
                </p>
            </div>

            <button
                class="btn btn-ghost"
                onclick="cancelInterview()"
            >
                Cancel
            </button>
        </div>

        <div class="stepper">
            ${steps}
        </div>

        ${body}

        <div
            class="btn-row"
            style="justify-content:space-between;"
        >
            <div>
                ${
                    currentStep > 0
                        ? `
                            <button
                                class="btn"
                                onclick="previousStep()"
                            >
                                ← Back
                            </button>
                        `
                        : ""
                }
            </div>

            <div class="btn-row">
                <button
                    class="btn btn-ghost"
                    onclick="saveInterviewDraftNow()"
                >
                    Save Draft
                </button>

                ${
                    currentStep < 4
                        ? `
                            <button
                                class="btn btn-primary"
                                onclick="nextStep()"
                            >
                                Next →
                            </button>
                        `
                        : `
                            <button
                                class="btn btn-gold"
                                onclick="finishInterview()"
                            >
                                Save Interview
                            </button>
                        `
                }
            </div>
        </div>
    `;
}

function jumpQuestion(index){
    currentInterview.currentQuestion = index;
    saveDraft();
    renderInterview();
}

function nextStep(){
    if(currentStep === 0){
        if(!currentInterview.name.trim()){
            alert("Please enter the applicant's name.");
            return;
        }
    }

    if(currentStep === 1){
        currentInterview.currentQuestion = 0;
    }

    saveDraft();

    if(currentStep < 4){
        currentStep++;
        renderInterview();
    }
}

function previousStep(){
    if(currentStep > 0){
        currentStep--;
        renderInterview();
    }
}

function saveInterviewDraftNow(){
    if(
        currentStep === 0 &&
        !currentInterview.name.trim()
    ){
        alert("Enter an applicant name before saving the draft.");
        return;
    }

    saveDraft();
    showToast("Interview draft saved.");
}

async function finishInterview(){
    if(!currentInterview.name.trim()){
        currentStep = 0;
        renderInterview();
        alert("Please enter the applicant's name.");
        return;
    }

    currentInterview.completed = true;
    currentInterview.status = "Complete";
    currentInterview.updatedAt =
        new Date().toISOString();

    if(!currentInterview.createdAt){
        currentInterview.createdAt =
            currentInterview.updatedAt;
    }

    const index =
        applicants.findIndex(
            applicant =>
                applicant.id === currentInterview.id
        );

    if(index >= 0){
        applicants[index] =
            clone(currentInterview);
    }else{
        applicants.push(
            clone(currentInterview)
        );
    }

    const success =
        await saveApplicants();

    if(!success){
        alert(
            "The interview could not be saved. Your draft is still preserved."
        );
        return;
    }

    clearDraft();

    const name =
        currentInterview.name;

    currentInterview = null;
    currentStep = 0;

    showToast(
        `Saved interview for ${name}.`
    );

    showPage("applicants");
}

function cancelInterview(){
    if(currentInterview){
        if(
            confirm(
                "Leave this interview?\n\nYour current work can remain saved as a draft."
            )
        ){
            if(
                currentInterview.name ||
                currentInterview.answers.some(
                    answer => String(answer).trim()
                )
            ){
                saveDraft();
            }

            currentInterview = null;
            showPage("dashboard");
        }
    }else{
        showPage("dashboard");
    }
}

function filterApplicants(){
    const container =
        document.getElementById("applicantList");

    if(!container){
        return;
    }

    const search =
        (
            document.getElementById("rosterSearch")?.value ||
            ""
        )
        .toLowerCase()
        .trim();

    const sort =
        document.getElementById("rosterSort")?.value ||
        "updated";

    let filtered =
        applicants.filter(
            applicant =>
                applicant.name
                    .toLowerCase()
                    .includes(search)
        );

    if(sort === "name"){
        filtered.sort(
            (a,b) =>
                a.name.localeCompare(b.name)
        );
    }

    if(sort === "score"){
        filtered.sort(
            (a,b) =>
                (scoreOf(b) || 0) -
                (scoreOf(a) || 0)
        );
    }

    if(sort === "updated"){
        filtered.sort(
            (a,b) =>
                new Date(b.updatedAt || 0) -
                new Date(a.updatedAt || 0)
        );
    }

    if(!filtered.length){
        container.innerHTML = `
            <div class="empty">
                ${
                    search
                        ? "No applicants match your search."
                        : "No applicants yet."
                }
            </div>
        `;

        return;
    }

    container.innerHTML =
        filtered.map(
            renderApplicantRow
        ).join("");
}

function buildBackupObject(){
    return {
        app:"Science Olympiad Interview HQ",
        formatVersion:3,
        exportedAt:new Date().toISOString(),
        applicants:applicants
    };
}

function downloadBlob(content,filename,type){
    const blob =
        new Blob(
            [content],
            {type:type}
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
        () => URL.revokeObjectURL(url),
        1000
    );
}

function downloadJSONBackup(){
    const backup =
        buildBackupObject();

    downloadBlob(
        JSON.stringify(
            backup,
            null,
            2
        ),
        "science-olympiad-master-backup-" +
            todayStr() +
            ".json",
        "application/json"
    );

    meta.lastBackupAt =
        Date.now();

    saveMeta();

    showToast(
        "JSON backup downloaded."
    );

    if(currentPage === "data"){
        renderData();
    }
}

function csvEscape(value){
    const text =
        value === undefined ||
        value === null
            ? ""
            : String(value);

    if(/[",\n]/.test(text)){
        return '"' +
            text.replace(/"/g,'""') +
            '"';
    }

    return text;
}

function downloadCSV(){
    const headers = [
        "Name",
        "Grade",
        "Interview Date",
        "Status",
        "Overall Score"
    ];

    QUESTIONS.forEach(
        (_,index) =>
            headers.push(
                "Question " +
                (index + 1) +
                " Answer"
            )
    );

    RATING_CATEGORIES.forEach(
        category =>
            headers.push(
                category.title +
                " Rating"
            )
    );

    headers.push(
        "Observations",
        "Notes",
        "Created At",
        "Updated At"
    );

    const rows = [headers];

    applicants.forEach(applicant => {
        const row = [
            applicant.name,
            applicant.grade,
            applicant.interviewDate,
            statusOf(applicant),
            scoreOf(applicant) !== null
                ? scoreOf(applicant).toFixed(2)
                : ""
        ];

        QUESTIONS.forEach(
            (_,index) =>
                row.push(
                    applicant.answers?.[index] || ""
                )
        );

        RATING_CATEGORIES.forEach(
            category =>
                row.push(
                    applicant.ratings?.[
                        category.key
                    ] || ""
                )
        );

        row.push(
            (applicant.observations || []).join("; "),
            applicant.notes || "",
            applicant.createdAt || "",
            applicant.updatedAt || ""
        );

        rows.push(row);
    });

    const csv =
        rows
            .map(
                row =>
                    row
                        .map(csvEscape)
                        .join(",")
            )
            .join("\n");

    downloadBlob(
        csv,
        "science-olympiad-applicants-" +
            todayStr() +
            ".csv",
        "text/csv;charset=utf-8"
    );

    showToast(
        "Spreadsheet downloaded."
    );
}

/* ============================================================
   MULTI-FILE JSON IMPORT
   ============================================================ */

function chooseImportMode(mode){
    const input =
        document.getElementById(
            "importFileInput"
        );

    input.dataset.mode = mode;

    /*
       This input intentionally has `multiple`.
       One selection can therefore contain several JSON backups.
    */

    input.click();
}

async function handleImportFiles(event){
    const files =
        Array.from(
            event.target.files || []
        );

    const mode =
        event.target.dataset.mode ||
        "merge";

    if(!files.length){
        return;
    }

    try{
        if(mode === "replace"){
            await replaceFromFiles(files);
        }else{
            await mergeSelectedFiles(files);
        }
    }finally{
        event.target.value = "";
        event.target.dataset.mode = "";
    }
}

async function mergeSelectedFiles(files){
    if(!files.length){
        alert(
            "Please select at least one JSON backup file."
        );
        return;
    }

    const confirmed =
        confirm(
            `You selected ${files.length} backup file(s).\n\n` +
            `The applicants in those files will be added to your current roster.\n\n` +
            `Existing records with the exact same applicant ID will use the newer version.\n\n` +
            `Applicants with different IDs but the same name will NOT be automatically merged.\n\n` +
            `Continue?`
        );

    if(!confirmed){
        return;
    }

    let filesRead = 0;
    let totalRecords = 0;
    let added = 0;
    let updated = 0;
    let skipped = 0;

    const errors = [];
    const importedRecords = [];

    /*
       Read EVERY selected file.
    */

    for(const file of files){
        try{
            const text =
                await file.text();

            const data =
                JSON.parse(text);

            const records =
                normalizeImportedData(data);

            filesRead++;
            totalRecords += records.length;

            importedRecords.push(
                ...records
            );
        }catch(error){
            errors.push(
                `${file.name}: ${
                    error.message ||
                    "Could not parse file"
                }`
            );
        }
    }

    if(!importedRecords.length){
        alert(
            "None of the selected files contained valid applicant records.\n\n" +
            (errors.length
                ? errors.join("\n")
                : "")
        );

        return;
    }

    /*
       Exact-ID merge.

       If a record with the same ID already exists,
       the record with the newer updatedAt timestamp wins.
    */

    const byId =
        new Map(
            applicants.map(
                applicant =>
                    [applicant.id,applicant]
            )
        );

    for(const imported of importedRecords){
        const existing =
            byId.get(imported.id);

        if(!existing){
            applicants.push(imported);

            byId.set(
                imported.id,
                imported
            );

            added++;

            continue;
        }

        const existingTime =
            Date.parse(
                existing.updatedAt || ""
            ) || 0;

        const importedTime =
            Date.parse(
                imported.updatedAt || ""
            ) || 0;

        if(importedTime > existingTime){
            const index =
                applicants.findIndex(
                    applicant =>
                        applicant.id ===
                        imported.id
                );

            if(index >= 0){
                applicants[index] =
                    imported;
            }

            byId.set(
                imported.id,
                imported
            );

            updated++;
        }else{
            skipped++;
        }
    }

    /*
       Check for possible duplicate names AFTER merging.

       We intentionally do not merge these automatically because
       two different students can legitimately have the same name.
    */

    const possibleDuplicates =
        findPossibleDuplicateNames();

    const saved =
        await saveApplicants();

    if(!saved){
        alert(
            "The files were read, but the merged roster could not be saved."
        );
        return;
    }

    renderData();

    showMergeSummary({
        filesRead,
        filesSelected:files.length,
        totalRecords,
        added,
        updated,
        skipped,
        errors,
        possibleDuplicates
    });
}

async function replaceFromFiles(files){
    if(!files.length){
        return;
    }

    if(
        !confirm(
            `This will replace all ${applicants.length} current applicants with the records in the selected backup file(s).\n\nThis is destructive. Continue?`
        )
    ){
        return;
    }

    const importedRecords = [];
    const errors = [];
    let filesRead = 0;

    for(const file of files){
        try{
            const text =
                await file.text();

            const data =
                JSON.parse(text);

            const records =
                normalizeImportedData(data);

            filesRead++;

            importedRecords.push(
                ...records
            );
        }catch(error){
            errors.push(
                `${file.name}: ${
                    error.message ||
                    "Could not parse file"
                }`
            );
        }
    }

    if(!importedRecords.length){
        alert(
            "No valid applicant records were found."
        );
        return;
    }

    /*
       If multiple files were selected for replacement,
       duplicate IDs are resolved the same way as merge:
       newer updatedAt wins.
    */

    const byId = new Map();

    for(const record of importedRecords){
        const existing =
            byId.get(record.id);

        if(!existing){
            byId.set(
                record.id,
                record
            );
            continue;
        }

        const oldTime =
            Date.parse(
                existing.updatedAt || ""
            ) || 0;

        const newTime =
            Date.parse(
                record.updatedAt || ""
            ) || 0;

        if(newTime > oldTime){
            byId.set(
                record.id,
                record
            );
        }
    }

    applicants =
        Array.from(
            byId.values()
        );

    const saved =
        await saveApplicants();

    if(!saved){
        alert(
            "The backup was read, but the replacement roster could not be saved."
        );
        return;
    }

    const possibleDuplicates =
        findPossibleDuplicateNames();

    renderData();

    showMergeSummary({
        filesRead,
        filesSelected:files.length,
        totalRecords:importedRecords.length,
        added:applicants.length,
        updated:0,
        skipped:
            importedRecords.length -
            applicants.length,
        errors,
        possibleDuplicates,
        replacement:true
    });
}

function findPossibleDuplicateNames(){
    const groups =
        new Map();

    applicants.forEach(applicant => {
        const normalized =
            normalizeName(
                applicant.name
            );

        if(!normalized){
            return;
        }

        if(!groups.has(normalized)){
            groups.set(
                normalized,
                []
            );
        }

        groups
            .get(normalized)
            .push(applicant);
    });

    return Array.from(
        groups.values()
    )
    .filter(
        group =>
            group.length > 1
    );
}

function showMergeSummary(result){
    const duplicateHTML =
        result.possibleDuplicates.length
            ? `
                <div
                    class="warning-box"
                    style="margin-top:15px;"
                >
                    <strong>
                        Possible duplicate names detected
                    </strong>

                    <p>
                        These records have the same normalized name
                        but different applicant IDs. They were kept
                        as separate applicants intentionally.
                    </p>

                    <ul>
                        ${result.possibleDuplicates
                            .map(
                                group =>
                                    `<li>
                                        ${group
                                            .map(
                                                applicant =>
                                                    escapeHTML(
                                                        applicant.name
                                                    )
                                            )
                                            .join(" · ")}
                                    </li>`
                            )
                            .join("")}
                    </ul>
                </div>
            `
            : `
                <div
                    class="info-box"
                    style="margin-top:15px;"
                >
                    No possible duplicate names were detected.
                </div>
            `;

    const errorHTML =
        result.errors.length
            ? `
                <div
                    class="danger-box"
                    style="margin-top:15px;"
                >
                    <strong>Files with errors</strong>

                    <ul>
                        ${result.errors
                            .map(
                                error =>
                                    `<li>${escapeHTML(error)}</li>`
                            )
                            .join("")}
                    </ul>
                </div>
            `
            : "";

    const existing =
        document.getElementById(
            "mergeResult"
        );

    if(existing){
        existing.innerHTML = `
            <div class="merge-summary">
                <h3>
                    ${
                        result.replacement
                            ? "Restore complete"
                            : "Merge complete"
                    }
                </h3>

                <div class="merge-grid">

                    <div class="merge-stat">
                        <strong>
                            ${result.filesRead}
                        </strong>
                        <span class="small muted">
                            Files read
                        </span>
                    </div>

                    <div class="merge-stat">
                        <strong>
                            ${result.totalRecords}
                        </strong>
                        <span class="small muted">
                            Records found
                        </span>
                    </div>

                    <div class="merge-stat">
                        <strong>
                            ${result.added}
                        </strong>
                        <span class="small muted">
                            Records added
                        </span>
                    </div>

                    <div class="merge-stat">
                        <strong>
                            ${result.updated}
                        </strong>
                        <span class="small muted">
                            Existing records updated
                        </span>
                    </div>

                    <div class="merge-stat">
                        <strong>
                            ${result.skipped}
                        </strong>
                        <span class="small muted">
                            Older duplicates skipped
                        </span>
                    </div>

                </div>

                ${errorHTML}

                ${duplicateHTML}
            </div>
        `;
    }

    showToast(
        result.replacement
            ? "Backup restored."
            : `Merged ${result.filesRead} JSON file(s).`
    );
}

/* ============================================================
   DATA PAGE
   ============================================================ */

function renderData(){
    let bytes = 0;

    try{
        bytes =
            new Blob([
                JSON.stringify(applicants)
            ]).size;
    }catch(error){
        bytes =
            JSON.stringify(applicants).length;
    }

    const kb =
        Math.round(
            bytes / 1024 * 10
        ) / 10;

    const since =
        daysSince(
            meta.lastBackupAt
        );

    const lastBackupText =
        meta.lastBackupAt
            ? `${formatDate(meta.lastBackupAt)}
               (${since} ${
                   since === 1
                       ? "day"
                       : "days"
               } ago)`
            : "Never";

    document.getElementById("main").innerHTML = `
        <div class="view-head">
            <div>
                <div class="view-eyebrow">DON'T SKIP THIS</div>

                <h1 class="view-title">
                    Backups & Data
                </h1>

                <p class="view-sub">
                    Your roster lives in this browser only.
                    Export a copy regularly so you never lose it.
                </p>
            </div>
        </div>

        <div class="card">
            <div class="kv">
                <span class="muted">
                    Applicants stored
                </span>

                <b>
                    ${applicants.length}
                </b>
            </div>

            <div class="kv">
                <span class="muted">
                    Approximate storage used
                </span>

                <b>
                    ${kb} KB
                </b>
            </div>

            <div class="kv">
                <span class="muted">
                    Last backup exported
                </span>

                <b>
                    ${lastBackupText}
                </b>
            </div>

            <div class="kv">
                <span class="muted">
                    Storage method
                </span>

                <b>
                    ${
                        usingIndexedDB
                            ? "IndexedDB"
                            : "Browser fallback"
                    }
                </b>
            </div>
        </div>

        <div class="card">
            <h3>Download a backup</h3>

            <p>
                Creates a file with every applicant,
                every answer, every observation,
                every note, and every rating.
            </p>

            <div class="btn-row">
                <button
                    class="btn btn-primary"
                    onclick="downloadJSONBackup()"
                >
                    Download backup (.json)
                </button>

                <button
                    class="btn btn-ghost"
                    onclick="downloadCSV()"
                >
                    Download as spreadsheet (.csv)
                </button>
            </div>

            <p class="hint">
                The <strong>.json</strong> file is the one to keep
                for safekeeping. It can be imported right back
                into this app.
            </p>
        </div>

        <div class="card">
            <h3>Restore from backup</h3>

            <p>
                Select one or more JSON backup files.
                You can combine backups from different browsers
                or different interview sessions.
            </p>

            <div class="file-drop">
                <h3>
                    Import JSON backups
                </h3>

                <p class="muted">
                    Multiple files can be selected at the same time.
                </p>

                <div class="btn-row" style="justify-content:center;">
                    <button
                        class="btn btn-primary"
                        onclick="chooseImportMode('merge')"
                    >
                        Add to current roster
                    </button>

                    <button
                        class="btn btn-danger"
                        onclick="chooseImportMode('replace')"
                    >
                        Replace everything
                    </button>
                </div>

                <p class="hint" style="margin-top:13px;">
                    <strong>
                        Add to current roster
                    </strong>
                    keeps everyone you already have and merges
                    the selected backups into them.

                    <br><br>

                    <strong>
                        Replace everything
                    </strong>
                    deletes the current browser roster first.
                    Use it only when restoring after data loss.
                </p>
            </div>

            <div id="mergeResult"></div>
        </div>

        <div class="card danger-zone">
            <h3>Danger zone</h3>

            <p>
                Permanently erase every applicant record from
                this browser.
            </p>

            <button
                class="btn btn-danger"
                onclick="eraseAll()"
            >
                Erase all applicant records
            </button>
        </div>

        <div class="card">
            <h3>Data safety reminder</h3>

            <p class="hint">
                Applicant records are stored locally in the browser.
                They are not automatically saved to GitHub.
            </p>

            <div class="info-box">
                Export a JSON backup after each interview session
                and keep it in an approved school storage location.
                Do not put applicant JSON files into a public GitHub
                repository.
            </div>
        </div>
    `;
}

async function eraseAll(){
    if(!applicants.length){
        alert(
            "There are no applicant records to erase."
        );
        return;
    }

    if(
        !confirm(
            "ERASE ALL APPLICANT RECORDS from this browser?\n\n" +
            "This cannot be undone without a backup."
        )
    ){
        return;
    }

    if(
        !confirm(
            "Final confirmation: have you exported a backup?\n\n" +
            "Click OK only if you are certain."
        )
    ){
        return;
    }

    const success =
        await replaceAll([]);

    if(success){
        showToast(
            "All browser records erased."
        );

        showPage("dashboard");
    }else{
        alert(
            "The browser did not allow the records to be erased."
        );
    }
}

/* ============================================================
   MAIN RENDER
   ============================================================ */

function render(){
    if(currentPage === "dashboard"){
        renderDashboard();
    }

    else if(currentPage === "interview"){
        renderInterview();
    }

    else if(currentPage === "applicants"){
        renderApplicants();
    }

    else if(currentPage === "guide"){
        renderGuide();
    }

    else if(currentPage === "data"){
        renderData();
    }

    updateNav();
}
